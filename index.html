<body>
<div class="shell" id="shell">
 <header class="brand" aria-label="LightDesk desktop"><span class="brand-mark" id="brandIcon"></span><span>LightDesk</span></header>
 <main class="desktop" id="desktop" aria-label="Desktop">
  <div class="desktop-icons" id="desktopIcons"></div>
  <div class="mobile-status"><span id="mobileTime">9:41</span><span aria-label="Network and battery">● &nbsp; ▰</span></div>
  <section class="mobile-home" id="mobileHome"><h1>Good day.</h1><div class="subtle" id="mobileDate"></div><div class="app-grid" id="mobileApps"></div></section>
  <div class="window-layer" id="windowLayer" aria-label="Application windows"></div>
 </main>
 <nav class="taskbar" aria-label="Taskbar"><div class="taskbar-left"><button class="start-button" id="startButton" title="App launcher" aria-label="Open app launcher"></button><div class="task-apps" id="taskApps"></div></div><div class="taskbar-right"><button class="icon-button" id="taskSettings" title="Settings" aria-label="Open Settings"></button><div class="clock" id="clock"></div></div></nav>
 <aside class="start-menu" id="startMenu" aria-label="App launcher"><div class="start-head"><strong>LightDesk</strong><span class="subtle">Apps</span></div><div class="start-grid" id="startGrid"></div><div class="divider"></div><div class="row space-between"><span class="subtle">Browser-based workspace</span><button class="button" data-open="settings">Settings</button></div></aside>
 <nav class="mobile-nav" aria-label="Mobile navigation"><button class="nav-button" id="mobileBack" aria-label="Back"></button><button class="nav-button" id="mobileHomeButton" aria-label="Home"></button><button class="nav-button" id="mobileRecent" aria-label="Recent apps"></button></nav>
</div>
<script>
(()=>{'use strict';
const KEY='lightdesk-v1';
const iconPaths={home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',note:'<path d="M6 3h9l4 4v14H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z"/><path d="M14 3v5h5M8 12h8M8 16h8"/>',calc:'<rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 6h8v4H8zM8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01M16 18h.01"/>',folder:'<path d="M3 6a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1a2 2 0 0 1-2.8 2.8l-.1-.1a2 2 0 0 0-3.4 1.4v.3a2 2 0 0 1-4 0v-.2a2 2 0 0 0-3.4-1.4l-.1.1A2 2 0 1 1 3 15.3l.1-.1A2 2 0 0 0 1.7 12H1.5a2 2 0 0 1 0-4h.2a2 2 0 0 0 1.4-3.4L3 4.5a2 2 0 1 1 2.8-2.8l.1.1A2 2 0 0 0 9.3.4V.2a2 2 0 0 1 4 0v.2a2 2 0 0 0 3.4 1.4l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a2 2 0 0 0 1.4 3.4h.2a2 2 0 0 1 0 4h-.2a2 2 0 0 0-1.5 3.5Z" transform="translate(1 1) scale(.92)"/>',store:'<path d="M4 8h16l-1 12H5L4 8Z"/><path d="M8 8V6a4 4 0 0 1 8 0v2M9 12v.01M15 12v.01"/>',about:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',close:'<path d="m6 6 12 12M18 6 6 18"/>',min:'<path d="M5 12h14"/>',max:'<rect x="5" y="5" width="14" height="14" rx="1"/>',restore:'<path d="M8 8V5h11v11h-3M5 8h11v11H5z"/>',back:'<path d="m15 18-6-6 6-6"/>',recent:'<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 9h8M8 13h5"/>',plus:'<path d="M12 5v14M5 12h14"/>'};

const $=s=>document.querySelector(s), desktopIcons=$('#desktopIcons'), startGrid=$('#startGrid'), mobileApps=$('#mobileApps'), layer=$('#windowLayer'), taskApps=$('#taskApps'), startMenu=$('#startMenu');

const windows=new Map();let z=20,active=null,mobileApp=null;
function getApp(id){if(id.startsWith('custom:'))return state.installed.find(a=>'custom:'+a.id===id);return APPS.find(a=>a.id===id)}
function openApp(id){if(id.startsWith('custom:')){openCustom(id.slice(7));return}const app=getApp(id);if(!app)return;if(windows.has(id)){const w=windows.get(id);w.el.classList.remove('hidden');focusWindow(id);return}if(modeDetect()==='mobile'){mobileApp=id;document.querySelectorAll('.window').forEach(e=>e.remove());windows.clear()}const el=document.createElement('section');el.className='window';el.dataset.id=id;el.setAttribute('role','dialog');el.setAttribute('aria-label',app.name);const pos=state.positions[id];if(pos&&modeDetect()!=='mobile'){el.style.left=pos.x+'px';el.style.top=pos.y+'px';if(pos.w)el.style.width=pos.w+'px';if(pos.h)el.style.height=pos.h+'px'}el.innerHTML=`<header class="window-header"><div class="window-title">${icon(app.icon)}<span>${esc(app.name)}</span></div><div class="window-controls"><button data-action="min" title="Minimize" aria-label="Minimize">${icon('min')}</button><button data-action="max" title="Maximize" aria-label="Maximize">${icon('max')}</button><button class="close" data-action="close" title="Close" aria-label="Close">${icon('close')}</button></div></header><div class="window-content" id="content-${esc(id.replace(':','-'))}">${appView(id)}</div>`;layer.append(el);windows.set(id,{el,app});focusWindow(id);makeDraggable(el);renderTasks();wireApp(el,id);if(modeDetect()==='mobile'){$('#mobileHome').classList.add('hidden');$('#mobileBack').disabled=false}}
function closeWindow(id){const w=windows.get(id);if(!w)return;w.el.remove();windows.delete(id);if(active===id)active=null;if(mobileApp===id)mobileApp=null;renderTasks();if(modeDetect()==='mobile'){document.querySelectorAll('.window').forEach(e=>e.remove());$('#mobileHome').classList.remove('hidden');$('#mobileBack').disabled=true}}
function focusWindow(id){const w=windows.get(id);if(!w)return;windows.forEach(x=>x.el.classList.remove('focused'));w.el.classList.add('focused');w.el.style.zIndex=++z;active=id;renderTasks()}
function minimizeWindow(id){const w=windows.get(id);if(w){w.el.classList.add('hidden');renderTasks()}}
function maximizeWindow(id){const w=windows.get(id);if(w){w.el.classList.toggle('maximized');w.el.querySelector('[data-action="max"]').innerHTML=icon(w.el.classList.contains('maximized')?'restore':'max')}}
function restoreWindow(id){const w=windows.get(id);if(w){w.el.classList.remove('hidden','maximized');focusWindow(id)}}
function renderTasks(){taskApps.innerHTML=[...windows.entries()].map(([id,w])=>`<button class="task-button ${active===id&&!w.el.classList.contains('hidden')?'active':''}" data-task="${esc(id)}" title="${esc(w.app.name)}" aria-label="${esc(w.app.name)}">${icon(w.app.icon)}</button>`).join('')}
function makeDraggable(el){const bar=el.querySelector('.window-header');let sx,sy,l,t,drag=false;bar.addEventListener('pointerdown',e=>{if(modeDetect()==='mobile'||el.classList.contains('maximized')||e.target.closest('button'))return;drag=true;focusWindow(el.dataset.id);sx=e.clientX;sy=e.clientY;const r=el.getBoundingClientRect();l=r.left;t=r.top;bar.setPointerCapture(e.pointerId)});bar.addEventListener('pointermove',e=>{if(!drag)return;el.style.left=Math.max(0,Math.min(innerWidth-el.offsetWidth,l+e.clientX-sx))+'px';el.style.top=Math.max(0,Math.min(innerHeight-el.offsetHeight-58,t+e.clientY-sy))+'px'});bar.addEventListener('pointerup',()=>{if(drag){drag=false;const r=el.getBoundingClientRect();state.positions[el.dataset.id]={x:r.left,y:r.top,w:r.width,h:r.height};save()}});el.addEventListener('pointerdown',()=>focusWindow(el.dataset.id))}
function appView(id){switch(id){case'notepad':return noteView();case'calculator':return calcView();case'files':return filesView(null);case'settings':return settingsView();case'about':return aboutView();case'store':return storeView();default:return '<p>App not found.</p>'}}
function noteView(){const n=state.notes[0];return `<div class="row space-between" style="margin-bottom:10px"><span class="subtle">Saved privately on this device</span><div class="row"><button class="button" data-note-new>New note</button><button class="button danger" data-note-delete>Delete</button></div></div><div class="note-layout"><aside class="note-list" id="noteList"></aside><div class="note-editor"><input class="note-title" id="noteTitle" aria-label="Note title" placeholder="Untitled note" value="${esc(n?.title||'')}"><textarea class="note-body" id="noteBody" aria-label="Note text" placeholder="Start writing…">${esc(n?.content||'')}</textarea><small class="subtle" id="noteSaved">Autosaved</small></div></div>`}
function calcView(){return `<div class="calc"><div class="calc-display"><div class="calc-expression" id="calcExpr" aria-live="polite"></div><div class="calc-result" id="calcResult">0</div></div><div class="calc-grid">${['AC','DEL','(',')','7','8','9','÷','4','5','6','×','1','2','3','−','0','.','=','+'].map(k=>`<button class="calc-key ${'÷×−+'.includes(k)?'op':''} ${k==='='?'equal':''}" data-key="${k}" aria-label="${k==='AC'?'Clear':k==='DEL'?'Delete':k}">${k}</button>`).join('')}</div></div>`}
function filesView(parent){const entries=state.files.filter(f=>(f.parent||null)===(parent||null));return `<div class="row space-between"><div><h2 class="section-title">Virtual Files</h2><div class="subtle">Browser-only files · not stored on your device's filesystem</div></div><div class="file-toolbar"><button class="button" data-folder-new>New folder</button><button class="button primary" data-file-new>New text file</button></div></div>${parent?`<button class="button" style="margin:10px 0" data-folder-up>← Back</button>`:''}<div class="file-list">${entries.map(f=>`<button class="file-card" data-file-id="${esc(f.id)}" data-file-type="${f.type}">${icon(f.type==='folder'?'folder':'note')}<strong>${esc(f.name)}</strong><small>${f.type==='folder'?'Folder':'Text file'}</small><span class="file-actions"><span data-file-action="rename" role="button" tabindex="0">Rename</span> · <span data-file-action="delete" role="button" tabindex="0">Delete</span></span></button>`).join('')||'<div class="empty">This folder is empty.</div>'}</div>`}
function settingsView(){return `<h2 class="section-title">Settings</h2><p class="subtle">Make this workspace yours. Changes are saved in this browser.</p><div class="settings-grid"><section class="settings-card"><h3>Appearance</h3><p>Choose a color theme.</p><div class="theme-options">${['dark','light','blue','purple','green'].map(t=>`<button class="button" data-theme="${t}" aria-pressed="${state.theme===t}">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div></section><section class="settings-card"><h3>Wallpaper</h3><p>Pick a desktop background.</p><div class="wallpaper-options">${[['aurora','Aurora'],['dusk','Dusk'],['ocean','Ocean'],['plain','Minimal']].map(([id,n])=>`<button class="button" data-wallpaper="${id}" aria-pressed="${state.wallpaper===id}">${n}</button>`).join('')}</div></section><section class="settings-card"><h3>Interface mode</h3><p>Automatic mode adapts to screen and input.</p><select class="field" id="modeSelect" aria-label="Interface mode">${[['auto','Automatic'],['desktop','Desktop'],['tablet','Tablet'],['mobile','Mobile']].map(([v,n])=>`<option value="${v}" ${state.mode===v?'selected':''}>${n}</option>`).join('')}</select></section><section class="settings-card"><h3>Motion</h3><p>Turn interface transitions on or off.</p><button class="button" data-motion>${state.animations?'Animations on':'Animations off'}</button></section><section class="settings-card"><h3>Local data</h3><p>Reset notes, files, apps and preferences stored here.</p><button class="button danger" data-reset>Reset saved data</button></section></div>`}
function aboutView(){return `<div class="about-hero"><div class="about-mark">${icon('home')}</div><h2 class="section-title">LightDesk</h2><p class="subtle">Version 1.0 · Browser-based desktop environment</p></div><div class="about-card"><p>LightDesk is a lightweight operating-system-inspired workspace that runs entirely in your browser. Notes, settings, virtual files and locally imported apps are stored on this device.</p><p><strong>Privacy:</strong> Nothing is uploaded by this standalone version.</p><p><a href="https://github.com/" target="_blank" rel="noreferrer" style="color:var(--accent)">GitHub repository placeholder</a></p></div>`}
function storeView(){const custom=[...state.storeApps];return `<div class="store-layout"><div class="row space-between"><div><h2 class="section-title">App Store</h2><div class="subtle">Built-in apps and locally shared HTML app packages.</div></div><button class="button" data-import-app>Import package</button></div><div class="app-grid">${APPS.filter(a=>a.id!=='store').map(a=>`<article class="store-card"><span class="card-icon">${icon(a.icon)}</span><h3>${esc(a.name)}</h3><p>${esc(a.desc)}</p><div class="row"><span class="badge">Built in</span><button class="button" data-store-open="${a.id}">Open</button></div></article>`).join('')}</div><div class="divider"></div><div class="row space-between"><div><h3 class="section-title">Community submissions</h3><p class="subtle">Submissions and approvals are local to this browser, not a public marketplace.</p></div><button class="button primary" data-create-app>Create app</button></div><div class="store-apps">${custom.map(a=>`<article class="store-card"><span class="card-icon">${icon('store')}</span><h3>${esc(a.name)}</h3><p>${esc(a.description||'No description')}</p><div class="row"><span class="badge">${esc(a.status||'Pending')}</span>${a.status==='approved'?`<button class="button" data-install="${esc(a.id)}">Install</button>`:`<button class="button" data-approve="${esc(a.id)}">Approve</button>`}</div><div class="row" style="margin-top:9px"><button class="button" data-download-package="${esc(a.id)}">Download</button><button class="button danger" data-remove-app="${esc(a.id)}">Remove</button></div></article>`).join('')||'<div class="empty">No community apps yet. Create one or import a package.</div>'}</div><p class="subtle">HTML apps run inside a sandboxed frame. Only install code you trust. Local approval is not secure moderation; publishing a shared store requires Firebase Authentication, Firestore/Storage and restrictive server-side security rules.</p><input type="file" id="appImportInput" accept=".json,.html,text/html,application/json" class="hidden"></div>`}
function wireApp(el,id){el.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.action){const act=b.dataset.action;if(act==='close')closeWindow(id);if(act==='min')minimizeWindow(id);if(act==='max')maximizeWindow(id);return}if(id==='notepad')noteClick(b);if(id==='calculator'&&b.dataset.key)calcKey(b.dataset.key);if(id==='files')fileClick(b);if(id==='settings')settingsClick(b);if(id==='store')storeClick(b);if(b.dataset.storeOpen)openApp(b.dataset.storeOpen)});if(id==='notepad'){renderNotes();const title=el.querySelector('#noteTitle'),body=el.querySelector('#noteBody');let timer;[title,body].forEach(x=>x.addEventListener('input',()=>{const note=state.notes.find(n=>n.id===selectedNote);if(note){note.title=title.value;note.content=body.value;note.updated=Date.now()}clearTimeout(timer);$('#noteSaved').textContent='Saving…';timer=setTimeout(()=>{save();renderNotes();$('#noteSaved').textContent='Autosaved'},250)}))}if(id==='calculator'){el.addEventListener('keydown',e=>{if(/^[0-9.+*/()%-]$/.test(e.key)){calcKey(e.key==='*'?'×':e.key==='/'?'÷':e.key==='-'?'−':e.key)}else if(e.key==='Enter'){calcKey('=')}else if(e.key==='Backspace'){calcKey('DEL')}else if(e.key==='Escape'){calcKey('AC')}})}if(id==='files')renderFileView(el,null);if(id==='settings'){const s=el.querySelector('#modeSelect');s.onchange=()=>{state.mode=s.value;save();applySettings()}}}
let selectedNote=null;function renderNotes(){const list=$('#noteList');if(!list)return;if(!selectedNote||!state.notes.some(n=>n.id===selectedNote))selectedNote=state.notes[0]?.id;list.innerHTML=state.notes.map(n=>`<button class="note-item ${n.id===selectedNote?'selected':''}" data-note-id="${esc(n.id)}"><strong>${esc(n.title||'Untitled note')}</strong><small>${new Date(n.updated||Date.now()).toLocaleDateString()}</small></button>`).join('')||'<div class="empty">No notes</div>';const n=state.notes.find(x=>x.id===selectedNote);const title=$('#noteTitle'),body=$('#noteBody');if(title&&n){title.value=n.title;body.value=n.content}}
function noteClick(b){if(b.hasAttribute('data-note-new')){const n={id:uid(),title:'Untitled note',content:'',updated:Date.now()};state.notes.unshift(n);selectedNote=n.id;save();const w=windows.get('notepad');w.el.querySelector('.window-content').innerHTML=noteView();wireApp(w.el,'notepad');return}if(b.hasAttribute('data-note-delete')){if(!selectedNote)return;state.notes=state.notes.filter(n=>n.id!==selectedNote);selectedNote=state.notes[0]?.id||null;save();const w=windows.get('notepad');w.el.querySelector('.window-content').innerHTML=noteView();wireApp(w.el,'notepad');return}if(b.dataset.noteId){selectedNote=b.dataset.noteId;renderNotes()}}
let calcInput='';function calcKey(k){if(k==='AC'){calcInput='';$('#calcExpr').textContent='';$('#calcResult').textContent='0';return}if(k==='DEL'){calcInput=calcInput.slice(0,-1)}else if(k==='='){try{const result=safeCalculate(calcInput);$('#calcExpr').textContent=calcInput;calcInput=String(Number.isFinite(result)?parseFloat(result.toPrecision(12)):result);$('#calcResult').textContent=calcInput;return}catch(_){$('#calcExpr').textContent='Invalid expression';return}}else calcInput+=({'×':'*','÷':'/','−':'-'}[k]||k);$('#calcResult').textContent=calcInput||'0'}
function safeCalculate(s){const tokens=s.match(/\d*\.?\d+|[()+\-*/]/g)||[];if(tokens.join('')!==s.replace(/\s/g,''))throw Error();let i=0;function expr(){let v=term();while(tokens[i]==='+'||tokens[i]==='-'){const op=tokens[i++],r=term();v=op==='+'?v+r:v-r}return v}function term(){let v=factor();while(tokens[i]==='*'||tokens[i]==='/'){const op=tokens[i++],r=factor();if(op==='/'&&r===0)throw Error();v=op==='*'?v*r:v/r}return v}function factor(){if(tokens[i]==='+'){i++;return factor()}if(tokens[i]==='-'){i++;return-factor()}if(tokens[i]==='('){i++;const v=expr();if(tokens[i++]!==')')throw Error();return v}const n=Number(tokens[i++]);if(!Number.isFinite(n))throw Error();return n}const v=expr();if(i!==tokens.length||!Number.isFinite(v))throw Error();return v}
let folderStack=[];function renderFileView(el,parent){const c=el.querySelector('.window-content');if(!c)return;c.innerHTML=filesView(parent);c.querySelectorAll('[data-file-id]').forEach(card=>card.addEventListener('dblclick',()=>{const f=state.files.find(x=>x.id===card.dataset.fileId);if(f?.type==='folder'){folderStack.push(f.id);renderFileView(el,f.id)}else editVirtualFile(el,f)}));}
function fileClick(b){const el=windows.get('files')?.el;if(!el)return;const parent=folderStack.at(-1)||null;if(b.hasAttribute('data-folder-new')){const name=prompt('Folder name');if(name?.trim()){state.files.push({id:uid(),name:name.trim(),type:'folder',parent,content:''});save();renderFileView(el,parent)}}if(b.hasAttribute('data-file-new')){const name=prompt('Text file name','New file.txt');if(name?.trim()){state.files.push({id:uid(),name:name.trim(),type:'text',parent,content:''});save();renderFileView(el,parent)}}if(b.hasAttribute('data-folder-up')){folderStack.pop();renderFileView(el,folderStack.at(-1)||null)}const card=b.closest('[data-file-id]');if(card){const f=state.files.find(x=>x.id===card.dataset.fileId);const action=b.dataset.fileAction;if(action==='delete'){if(confirm(`Delete ${f.name}?`)){state.files=state.files.filter(x=>x.id!==f.id&&x.parent!==f.id);save();renderFileView(el,parent)}}else if(action==='rename'){const n=prompt('Rename file',f.name);if(n?.trim()){f.name=n.trim();save();renderFileView(el,parent)}}else if(f?.type==='text')editVirtualFile(el,f);else if(f?.type==='folder'){folderStack.push(f.id);renderFileView(el,f.id)}}}
function editVirtualFile(el,f){const c=el.querySelector('.window-content');c.innerHTML=`<div class="row space-between"><button class="button" data-file-back>← Files</button><span class="subtle">Virtual text file</span><button class="button primary" data-file-save>Save</button></div><label class="field-label" for="virtualName">File name</label><input class="field" id="virtualName" value="${esc(f.name)}"><textarea class="field" id="virtualContent" style="height:calc(100% - 100px);margin-top:10px;resize:none" aria-label="File contents">${esc(f.content)}</textarea>`;c.querySelector('[data-file-back]').onclick=()=>renderFileView(el,folderStack.at(-1)||null);c.querySelector('[data-file-save]').onclick=()=>{f.name=c.querySelector('#virtualName').value;f.content=c.querySelector('#virtualContent').value;save();renderFileView(el,folderStack.at(-1)||null);toast('File saved')}}
function settingsClick(b){if(b.dataset.theme){state.theme=b.dataset.theme;save();applySettings()}if(b.dataset.wallpaper){state.wallpaper=b.dataset.wallpaper;save();applySettings()}if(b.hasAttribute('data-motion')){state.animations=!state.animations;save();applySettings()}if(b.hasAttribute('data-reset')){if(confirm('Reset all LightDesk data in this browser? This cannot be undone.')){localStorage.removeItem(KEY);state=defaults();selectedNote=null;folderStack=[];save();windows.forEach((_,id)=>closeWindow(id));applySettings();toast('LightDesk data reset')}}}
function storeClick(b){if(b.hasAttribute('data-create-app')){showCreateForm();return}if(b.hasAttribute('data-import-app')){$('#appImportInput')?.click();return}if(b.dataset.approve){const a=state.storeApps.find(x=>x.id===b.dataset.approve);if(a){a.status='approved';save();refreshApp('store');toast('Approved locally on this browser')}}if(b.dataset.install){const a=state.storeApps.find(x=>x.id===b.dataset.install);if(a&&!state.installed.some(x=>x.id===a.id)){state.installed.push(a);save();renderAll();refreshApp('store');toast('App installed')}}if(b.dataset.downloadPackage){const a=state.storeApps.find(x=>x.id===b.dataset.downloadPackage);if(a)download(`${a.id}.lightdesk.json`,JSON.stringify(a,null,2),'application/json')}if(b.dataset.removeApp){state.storeApps=state.storeApps.filter(x=>x.id!==b.dataset.removeApp);state.installed=state.installed.filter(x=>x.id!==b.dataset.removeApp);save();renderAll();refreshApp('store')} }
function showCreateForm(){const el=windows.get('store')?.el,c=el?.querySelector('.window-content');if(!c)return;c.innerHTML=`<h2 class="section-title">Create an app package</h2><p class="subtle">Create a standalone HTML mini-app. It will be pending until locally approved.</p><form class="store-form" id="createAppForm"><label class="field-label">App name</label><input class="field" name="name" maxlength="48" required><label class="field-label">Description</label><input class="field" name="description" maxlength="160"><label class="field-label">HTML app source</label><textarea class="field" name="html" required placeholder="<!doctype html><html>…"></html>"></textarea><div class="row" style="margin-top:12px"><button class="button primary">Save submission</button><button type="button" class="button" data-return-store>Cancel</button></div></form>`;c.querySelector('#createAppForm').onsubmit=e=>{e.preventDefault();const d=new FormData(e.currentTarget);const html=String(d.get('html'));if(!/<html[\s>]/i.test(html)||html.length>500000){toast('Provide a complete HTML file under 500 KB.');return}state.storeApps.unshift({id:uid(),name:String(d.get('name')).trim(),description:String(d.get('description')).trim(),html,status:'pending',created:Date.now()});save();refreshApp('store');toast('App submitted to this browser’s local queue')};c.querySelector('[data-return-store]').onclick=()=>refreshApp('store')}
function openCustom(id){const a=state.installed.find(x=>x.id===id);if(!a)return toast('Install this app first.');const winId='custom:'+id;if(windows.has(winId)){restoreWindow(winId);return}if(modeDetect()==='mobile'){document.querySelectorAll('.window').forEach(e=>e.remove());windows.clear()}const el=document.createElement('section');el.className='window';el.dataset.id=winId;el.setAttribute('role','dialog');el.setAttribute('aria-label',a.name);el.innerHTML=`<header class="window-header"><div class="window-title">${icon('store')}<span>${esc(a.name)}</span></div><div class="window-controls"><button data-action="min" aria-label="Minimize">${icon('min')}</button><button data-action="max" aria-label="Maximize">${icon('max')}</button><button class="close" data-action="close" aria-label="Close">${icon('close')}</button></div></header><div class="window-content" style="padding:0"><iframe title="${esc(a.name)}" sandbox="allow-scripts" style="width:100%;height:100%;border:0;background:white"></iframe></div>`;layer.append(el);el.querySelector('iframe').srcdoc=a.html;windows.set(winId,{el,app:{id:winId,name:a.name,icon:'store'}});focusWindow(winId);makeDraggable(el);el.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b?.dataset.action==='close')closeWindow(winId);if(b?.dataset.action==='min')minimizeWindow(winId);if(b?.dataset.action==='max')maximizeWindow(winId)});renderTasks()}
function refreshApp(id){const w=windows.get(id);if(!w)return;w.el.querySelector('.window-content').innerHTML=appView(id);wireApp(w.el,id)}
function download(name,text,type){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([text],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function toast(text){const old=document.querySelector('.toast');old?.remove();const t=document.createElement('div');t.className='toast';t.textContent=text;document.querySelector('.shell').append(t);setTimeout(()=>t.remove(),2600)}
$('#appImportInput').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;try{let a;if(file.name.endsWith('.html')){const html=await file.text();a={id:uid(),name:file.name.replace(/\.html$/i,''),description:'Imported HTML app',html,status:'approved'}}else{a=JSON.parse(await file.text());if(!a.name||typeof a.html!=='string'||a.html.length>500000)throw Error('Invalid package');a={id:uid(),name:String(a.name).slice(0,48),description:String(a.description||'').slice(0,160),html:a.html,status:'approved'}}state.storeApps.unshift(a);state.installed.push(a);save();renderAll();refreshApp('store');toast('App imported and installed')}catch(_){toast('Could not import that app package.')}e.target.value=''});
function applyWallpaper(){const map={aurora:'radial-gradient(ellipse at 18% 20%,#393d8a 0,transparent 38%),radial-gradient(ellipse at 80% 72%,#145d67 0,transparent 40%),linear-gradient(135deg,#111522,#202b42 58%,#142b34)',dusk:'radial-gradient(ellipse at 15% 25%,#923f87 0,transparent 40%),radial-gradient(ellipse at 80% 75%,#dd8159 0,transparent 38%),linear-gradient(135deg,#251a39,#59345d 60%,#182039)',ocean:'radial-gradient(ellipse at 22% 22%,#087ca8 0,transparent 40%),radial-gradient(ellipse at 78% 76%,#26a18c 0,transparent 40%),linear-gradient(135deg,#062232,#075276 60%,#073e45)',plain:'linear-gradient(135deg,#202531,#343b4c)'};document.documentElement.style.setProperty('--wallpaper',map[state.wallpaper]||map.aurora)}
$('#startButton').onclick=()=>startMenu.classList.toggle('open');document.addEventListener('click',e=>{if(!e.target.closest('#startMenu')&&!e.target.closest('#startButton'))startMenu.classList.remove('open');const open=e.target.closest('[data-open]');if(open){openApp(open.dataset.open);startMenu.classList.remove('open')}const task=e.target.closest('[data-task]');if(task){const w=windows.get(task.dataset.task);if(w&&!w.el.classList.contains('hidden'))minimizeWindow(task.dataset.task);else restoreWindow(task.dataset.task)}});
$('#taskSettings').onclick=()=>openApp('settings');$('#mobileHomeButton').onclick=()=>{document.querySelectorAll('.window').forEach(x=>x.remove());windows.clear();mobileApp=null;$('#mobileHome').classList.remove('hidden');renderTasks()};$('#mobileBack').onclick=()=>{if(mobileApp)closeWindow(mobileApp);else $('#mobileHome').classList.remove('hidden')};$('#mobileRecent').onclick=()=>{if(active)restoreWindow(active);else $('#mobileHome').classList.remove('hidden')};
document.addEventListener('dblclick',e=>{const b=e.target.closest('.desktop-icon');if(b)openApp(b.dataset.open)});document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();startMenu.classList.toggle('open')}if(e.key==='Escape')startMenu.classList.remove('open')});
function updateClock(){const d=new Date();$('#clock').innerHTML=`${d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}<span>${d.toLocaleDateString([],{month:'short',day:'numeric'})}</span>`;$('#mobileTime').textContent=d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});$('#mobileDate').textContent=d.toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'})}
$('#shell').addEventListener('click',e=>{const card=e.target.closest('.file-card');if(card&&e.detail===1){/* single click selects; double-click opens folders */}});window.addEventListener('resize',()=>{document.documentElement.dataset.mode=modeDetect();if(modeDetect()==='mobile'&&mobileApp){const w=windows.get(mobileApp);if(w){w.el.style.left='0';w.el.style.top='0'}}});
// Restore wallpaper, interface preferences and the built-in app surface.
applyWallpaper();applySettings();$('#mobileBack').disabled=true;setInterval(updateClock,15000);
})();
</script>

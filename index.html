<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101827">
  <meta name="description" content="LightDesk browser-based desktop environment">
  <title>LightDesk</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" class="app-shell" data-mode="desktop">
    <header class="mobile-status" aria-label="Mobile status bar">
      <span id="mobile-time">--:--</span>
      <span class="status-label">LightDesk</span>
    </header>

    <main id="desktop" class="desktop" aria-label="LightDesk desktop">
      <section id="desktop-icons" class="desktop-icons" aria-label="Desktop applications"></section>
      <section id="windows" class="windows" aria-label="Open application windows"></section>
    </main>

    <nav id="taskbar" class="taskbar" aria-label="Taskbar">
      <button id="start-button" class="taskbar-button start-button" type="button" aria-expanded="false" aria-controls="start-menu">
        <span class="icon" data-icon="grid"></span>
        <span class="button-label">Start</span>
      </button>
      <div id="task-apps" class="task-apps" aria-label="Open applications"></div>
      <div class="taskbar-right">
        <button id="launcher-button" class="taskbar-button icon-button" type="button" title="App launcher" aria-label="Open app launcher">
          <span class="icon" data-icon="apps"></span>
        </button>
        <span id="clock" class="clock" aria-label="Current time">--:--</span>
      </div>
    </nav>

    <nav id="mobile-nav" class="mobile-nav" aria-label="Mobile navigation">
      <button type="button" data-mobile-nav="home" aria-label="Home">
        <span class="icon" data-icon="home"></span>
        <span>Home</span>
      </button>
      <button type="button" data-mobile-nav="apps" aria-label="Applications">
        <span class="icon" data-icon="apps"></span>
        <span>Apps</span>
      </button>
      <button type="button" data-mobile-nav="back" aria-label="Back">
        <span class="icon" data-icon="back"></span>
        <span>Back</span>
      </button>
    </nav>

    <aside id="start-menu" class="start-menu" hidden aria-label="Start menu">
      <div class="start-header">
        <div>
          <strong>LightDesk</strong>
          <span id="start-mode">Desktop mode</span>
        </div>
        <span class="icon large-icon" data-icon="spark"></span>
      </div>
      <div id="start-apps" class="start-apps"></div>
      <button class="menu-settings" type="button" data-open-app="settings">
        <span class="icon" data-icon="settings"></span>
        Settings
      </button>
    </aside>

    <div id="toast-region" class="toast-region" aria-live="polite"></div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>

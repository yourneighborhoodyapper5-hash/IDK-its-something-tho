:root[data-mode=mobile] .desktop{inset:0;padding:0;background:#08111a22}:root[data-mode=mobile] .brand,:root[data-mode=mobile] .desktop-icons,:root[data-mode=mobile] .taskbar,:root[data-mode=mobile] .start-menu{display:none!important}:root[data-mode=mobile] .mobile-status{position:absolute;z-index:5;top:0;left:0;right:0;height:40px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;color:white;text-shadow:0 1px 5px #0008;font-size:12px}:root[data-mode=mobile] .mobile-home{display:block;position:absolute;inset:40px 0 70px;padding:20px;color:white;overflow:auto}:root[data-mode=mobile] .mobile-home h1{font-size:27px;margin:10px 0 3px}:root[data-mode=mobile] .mobile-home .app-grid{grid-template-columns:repeat(4,1fr);gap:10px;margin-top:22px}:root[data-mode=mobile] .mobile-home .launch-card{color:white;padding:8px 2px;font-size:11px}:root[data-mode=mobile] .mobile-home .app-symbol{width:52px;height:52px;border-radius:17px;background:#ffffff23;color:white}:root[data-mode=mobile] .mobile-nav{position:absolute;z-index:1200;bottom:0;left:0;right:0;height:70px;display:flex;align-items:center;justify-content:space-around;background:#111722e8;border-top:1px solid #ffffff20;color:white;padding-bottom:env(safe-area-inset-bottom)}:root[data-mode=mobile] .window-layer{inset:40px 0 70px;z-index:50}:root[data-mode=mobile] .window{inset:0!important;left:0!important;top:0!important;width:100%!important;height:100%!important;min-width:0;min-height:0;resize:none;border:0;border-radius:0;box-shadow:none}:root[data-mode=mobile] .window-header{height:52px}:root[data-mode=mobile] .window-controls button:not(.close){display:none}:root[data-mode=mobile] .window-content{padding:13px}:root[data-mode=mobile] .note-layout{grid-template-columns:105px 1fr}

<body>
<div class="shell" id="shell">
<header class="brand"><span class="brand-mark" id="brandIcon"></span><span>LightDesk</span></header>
<main class="desktop" aria-label="LightDesk workspace"><div class="desktop-icons" id="desktopIcons"></div><div class="mobile-status"><span id="mobileTime"></span><span>Network · Battery</span></div><section class="mobile-home" id="mobileHome"><h1>Good day.</h1><div class="subtle" id="mobileDate"></div><div class="app-grid" id="mobileApps"></div></section><div class="window-layer" id="windowLayer"></div></main>
<nav class="taskbar" aria-label="Taskbar"><div class="task-left"><button class="start-button" id="startButton" aria-label="Open app launcher" title="Apps"></button><div class="task-apps" id="taskApps"></div></div><div class="task-right"><button class="tool-button" id="taskSettings" aria-label="Settings" title="Settings"></button><div class="clock" id="clock"></div></div></nav>
<aside class="start-menu" id="startMenu"><div class="row between"><strong>LightDesk</strong><span class="subtle">Apps</span></div><div class="start-grid" id="startGrid"></div><div class="divider"></div><button class="button" data-open="settings">Settings</button></aside>
<nav class="mobile-nav" aria-label="Mobile navigation"><button id="mobileBack" aria-label="Back"></button><button id="mobileHomeButton" aria-label="Home"></button><button id="mobileRecent" aria-label="Recent apps"></button></nav>
</div>
<script>
(()=>{'use strict';
const KEY='lightdesk-v3';
const svgPaths={home:'<path d="m3 10 9-7 9 7v10h-6v-7H9v7H3z"/>',note:'<path d="M6 3h9l4 4v14H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z"/><path d="M14 3v5h5M8 12h8M8 16h8"/>',calc:'<rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 6h8v4H8zM8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01M16 18h.01"/>',folder:'<path d="M3 6a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M19 13a7 7 0 0 0 0-2l2-1.5-2-3.5-2.4 1a7 7 0 0 0-1.7-1L14.5 3h-5L9 6a7 7 0 0 0-1.7 1l-2.4-1-2 3.5L5 11a7 7 0 0 0 0 2l-2.1 1.5 2 3.5 2.4-1a7 7 0 0 0 1.7 1l.5 3h5l.5-3a7 7 0 0 0 1.7-1l2.4 1 2-3.5z" transform="translate(1 0) scale(.9)"/>',store:'<path d="M4 8h16l-1 12H5L4 8Z"/><path d="M8 8V6a4 4 0 0 1 8 0v2"/>',about:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',close:'<path d="m6 6 12 12M18 6 6 18"/>',min:'<path d="M5 12h14"/>',max:'<rect x="5" y="5" width="14" height="14" rx="1"/>',restore:'<path d="M8 8V5h11v11h-3M5 8h11v11H5z"/>',back:'<path d="m15 18-6-6 6-6"/>',recent:'<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 9h8M8 13h5"/>'};
const icon=n=>`<svg viewBox="0 0 24 24" aria-hidden="true">${svgPaths[n]||svgPaths.about}</svg>`;
const APPS=[{id:'notepad',name:'Notepad',icon:'note',desc:'Create and autosave notes.'},{id:'calculator',name:'Calculator',icon:'calc',desc:'Arithmetic with keyboard support.'},{id:'files',name:'Files',icon:'folder',desc:'Manage a browser-only virtual file system.'},{id:'settings',name:'Settings',icon:'settings',desc:'Change theme and device layout.'},{id:'store',name:'App Store',icon:'store',desc:'Browse and submit community apps.'},{id:'about',name:'About',icon:'about',desc:'About the LightDesk environment.'}];
const uid=()=>Math.random().toString(36).slice(2,10),$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function defaults(){return{theme:'dark',mode:'auto',wallpaper:'aurora',notes:[{id:uid(),title:'Welcome to LightDesk',content:'Your notes and preferences stay in this browser.',updated:Date.now()}],files:[{id:uid(),name:'Documents',type:'folder',parent:null,content:''},{id:uid(),name:'Welcome.txt',type:'text',parent:null,content:'This is a virtual file, stored in this browser.'}],positions:{},installed:[]}}
function load(){try{let d=JSON.parse(localStorage.getItem(KEY));if(!d||typeof d!=='object')return defaults();return{...defaults(),...d,notes:Array.isArray(d.notes)?d.notes:[],files:Array.isArray(d.files)?d.files:[],installed:Array.isArray(d.installed)?d.installed:[]}}catch{return defaults()}}
let state=load(),windows=new Map(),z=20,active=null,mobileApp=null,selectedNote=null,calcInput='',folderStack=[];
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{toast('Browser storage is full or unavailable.')}}
function mode(){if(state.mode!=='auto')return state.mode;let w=innerWidth,coarse=matchMedia('(pointer:coarse)').matches||navigator.maxTouchPoints>0;return w<700?'mobile':w<1050&&coarse?'tablet':'desktop'}
const wallpapers={aurora:'radial-gradient(ellipse at 20% 20%,#3d4b9d 0,transparent 38%),radial-gradient(ellipse at 80% 70%,#087078 0,transparent 42%),linear-gradient(135deg,#101827,#213b54)',dusk:'radial-gradient(ellipse at 15% 25%,#923f87,transparent 40%),radial-gradient(ellipse at 80% 75%,#dd8159,transparent 38%),linear-gradient(135deg,#251a39,#59345d)',ocean:'radial-gradient(ellipse at 22% 22%,#087ca8,transparent 40%),radial-gradient(ellipse at 78% 76%,#26a18c,transparent 40%),linear-gradient(135deg,#062232,#075276)',plain:'linear-gradient(135deg,#202531,#343b4c)'};
const desktopIcons=$('#desktopIcons'),startGrid=$('#startGrid'),mobileApps=$('#mobileApps'),layer=$('#windowLayer'),taskApps=$('#taskApps'),startMenu=$('#startMenu');
function allApps(){return[...APPS,...state.installed.map(a=>({id:'custom:'+a.id,name:a.name,icon:'store',desc:a.description||''}))]}
function renderAll(){let apps=allApps();$('#brandIcon').innerHTML=icon('home');$('#startButton').innerHTML=icon('home');$('#taskSettings').innerHTML=icon('settings');$('#mobileBack').innerHTML=icon('back');$('#mobileHomeButton').innerHTML=icon('home');$('#mobileRecent').innerHTML=icon('recent');desktopIcons.innerHTML=apps.map(a=>`<button class="desktop-icon" data-open="${esc(a.id)}" aria-label="Open ${esc(a.name)}"><span class="app-symbol">${icon(a.icon)}</span><span>${esc(a.name)}</span></button>`).join('');let card=a=>`<button class="launch-card" data-open="${esc(a.id)}"><span class="app-symbol">${icon(a.icon)}</span><span>${esc(a.name)}</span></button>`;startGrid.innerHTML=apps.map(card).join('');mobileApps.innerHTML=apps.map(card).join('');document.documentElement.dataset.mode=mode();renderTasks();clock()}
function appFor(id){return id.startsWith('custom:')?state.installed.find(a=>'custom:'+a.id===id):APPS.find(a=>a.id===id)}
function openApp(id){if(id.startsWith('custom:'))return openCustom(id.slice(7));let app=appFor(id);if(!app)return;if(windows.has(id)){restoreWindow(id);return}if(mode()==='mobile'){mobileApp=id;for(let w of windows.values())w.el.remove();windows.clear()}let el=document.createElement('section');el.className='window';el.dataset.id=id;el.setAttribute('role','dialog');el.setAttribute('aria-label',app.name);let p=state.positions[id];if(p&&mode()!=='mobile'){el.style.left=p.x+'px';el.style.top=p.y+'px';if(p.w)el.style.width=p.w+'px';if(p.h)el.style.height=p.h+'px'}el.innerHTML=`<header class="window-header"><div class="window-title">${icon(app.icon)}<span>${esc(app.name)}</span></div><div class="window-controls"><button data-action="min" title="Minimize" aria-label="Minimize">${icon('min')}</button><button data-action="max" title="Maximize" aria-label="Maximize">${icon('max')}</button><button class="close" data-action="close" title="Close" aria-label="Close">${icon('close')}</button></div></header><div class="window-content">${view(id)}</div>`;layer.append(el);windows.set(id,{el,app});focus(id);drag(el);wire(el,id);renderTasks();if(mode()==='mobile'){$('#mobileHome').classList.add('hidden');$('#mobileBack').disabled=false}}
function focus(id){let w=windows.get(id);if(!w)return;for(let x of windows.values())x.el.classList.remove('focused');w.el.classList.add('focused');w.el.style.zIndex=++z;active=id;renderTasks()}
function close(id){let w=windows.get(id);if(!w)return;w.el.remove();windows.delete(id);if(mobileApp===id)mobileApp=null;if(active===id)active=null;renderTasks();if(mode()==='mobile'){$('#mobileHome').classList.remove('hidden');$('#mobileBack').disabled=true}}
function minimize(id){windows.get(id)?.el.classList.add('hidden');renderTasks()}
function restoreWindow(id){let w=windows.get(id);if(w){w.el.classList.remove('hidden','maximized');focus(id)}}
function maximize(id){let el=windows.get(id)?.el;if(!el)return;el.classList.toggle('maximized');el.querySelector('[data-action=max]').innerHTML=icon(el.classList.contains('maximized')?'restore':'max')}
function renderTasks(){taskApps.innerHTML=[...windows].map(([id,w])=>`<button class="task-button ${id===active&&!w.el.classList.contains('hidden')?'active':''}" data-task="${esc(id)}" aria-label="${esc(w.app.name)}" title="${esc(w.app.name)}">${icon(w.app.icon)}</button>`).join('')}
function drag(el){let bar=el.querySelector('.window-header'),sx=0,sy=0,left=0,top=0,moving=false;bar.addEventListener('pointerdown',e=>{if(mode()==='mobile'||e.target.closest('button')||el.classList.contains('maximized'))return;moving=true;focus(el.dataset.id);let r=el.getBoundingClientRect();sx=e.clientX;sy=e.clientY;left=r.left;top=r.top;bar.setPointerCapture(e.pointerId)});bar.addEventListener('pointermove',e=>{if(!moving)return;el.style.left=Math.max(0,Math.min(innerWidth-el.offsetWidth,left+e.clientX-sx))+'px';el.style.top=Math.max(0,Math.min(innerHeight-el.offsetHeight-58,top+e.clientY-sy))+'px'});bar.addEventListener('pointerup',()=>{if(!moving)return;moving=false;let r=el.getBoundingClientRect();state.positions[el.dataset.id]={x:r.left,y:r.top,w:r.width,h:r.height};save()});el.addEventListener('pointerdown',()=>focus(el.dataset.id))}
function view(id){if(id==='notepad')return noteView();if(id==='calculator')return calcView();if(id==='files')return filesView(null);if(id==='settings')return settingsView();if(id==='store')return storeView();if(id==='about')return aboutView();return'<p>Unable to open this app.</p>'}
function noteView(){let n=state.notes[0];return`<div class="row between" style="margin-bottom:9px"><span class="subtle">Autosaved on this device</span><div class="row"><button class="button" data-note-new>New note</button><button class="button danger" data-note-delete>Delete</button></div></div><div class="note-layout"><aside class="note-list" id="noteList"></aside><div class="note-editor"><input class="note-title" id="noteTitle" aria-label="Note title" placeholder="Untitled" value="${esc(n?.title||'')}"><textarea class="note-body" id="noteBody" aria-label="Note content" placeholder="Start writing…">${esc(n?.content||'')}</textarea></div></div>`}
function calcView(){return`<div class="calc"><div class="calc-display"><div id="calcExpr" class="calc-expression"></div><div id="calcResult" class="calc-result">0</div></div><div class="calc-grid">${['AC','DEL','(',')','7','8','9','÷','4','5','6','×','1','2','3','−','0','.','=','+'].map(k=>`<button class="calc-key ${'÷×−+'.includes(k)?'op':''} ${k==='='?'equal':''}" data-key="${k}">${k}</button>`).join('')}</div></div>`}
function filesView(parent){let fs=state.files.filter(f=>(f.parent||null)===(parent||null));return`<div class="row between"><div><h2 class="section-title">Virtual Files</h2><span class="subtle">Stored in browser storage; not your actual filesystem.</span></div><div class="file-toolbar"><button class="button" data-folder-new>New folder</button><button class="button primary" data-file-new>New text file</button></div></div>${parent?'<button class="button" data-folder-up style="margin-top:10px">Back</button>':''}<div class="file-list">${fs.map(f=>`<article class="file-card" data-file-id="${esc(f.id)}">${icon(f.type==='folder'?'folder':'note')}<strong>${esc(f.name)}</strong><small>${f.type==='folder'?'Folder':'Text file'}</small><div class="file-actions">${f.type==='folder'?'<button class="button" data-file-open>Open</button>':'<button class="button" data-file-open>Edit</button>'}<button class="button" data-file-rename>Rename</button><button class="button danger" data-file-delete>Delete</button></div></article>`).join('')||'<div class="empty">This folder is empty.</div>'}</div>`}
function settingsView(){return`<h2 class="section-title">Settings</h2><p class="subtle">Changes are saved in this browser.</p><div class="settings-grid"><section class="settings-card"><h3>Theme</h3><p>Choose a color scheme.</p>${['dark','light','blue','purple','green'].map(t=>`<button class="button" data-theme="${t}">${t[0].toUpperCase()+t.slice(1)}</button> `).join('')}</section><section class="settings-card"><h3>Wallpaper</h3><p>Choose your background.</p>${[['aurora','Aurora'],['dusk','Dusk'],['ocean','Ocean'],['plain','Minimal']].map(x=>`<button class="button" data-wallpaper="${x[0]}">${x[1]}</button> `).join('')}</section><section class="settings-card"><h3>Interface mode</h3><p>Automatic adapts to viewport and touch input.</p><select class="field" id="modeSelect">${[['auto','Automatic'],['desktop','Desktop'],['tablet','Tablet'],['mobile','Mobile']].map(([v,n])=>`<option value="${v}" ${state.mode===v?'selected':''}>${n}</option>`).join('')}</select></section><section class="settings-card"><h3>Reset</h3><p>Delete LightDesk data saved in this browser.</p><button class="button danger" data-reset>Reset saved data</button></section></div>`}
function aboutView(){return`<div class="about-card"><h2 class="section-title">LightDesk</h2><p>Version 1.2 — a lightweight browser desktop that adapts to desktop, tablet and mobile layouts.</p><p>Preferences, notes and simulated files remain in local browser storage. Community app listings use Firebase Firestore.</p><a href="https://github.com/" target="_blank" rel="noreferrer">GitHub repository placeholder</a></div>`}
function storeView(){return`<div class="store-layout"><div class="row between"><div><h2 class="section-title">LightDesk App Store</h2><p class="subtle">Approved HTML app packages are public. Only the configured owner can review submissions.</p></div><button class="button" data-store-refresh>Refresh</button></div><div id="authStatus" class="subtle">Connect to the community store when you open this page.</div><div class="store-apps" id="publicApps"><div class="empty">Open the store to load published apps.</div></div><div class="divider"></div><details><summary>Submit an app</summary><p class="subtle">New submissions are private until reviewed and approved.</p><form id="submitForm" class="store-form"><label class="field-label">App name</label><input class="field" name="name" maxlength="48" required><label class="field-label">Description</label><input class="field" name="description" maxlength="160"><label class="field-label">HTML app source (max 350 KB)</label><textarea class="field" name="html" required></textarea><div class="row" style="margin-top:10px"><button class="button primary">Submit for approval</button><label class="button">Choose .html file<input type="file" id="uploadHtml" accept=".html,text/html" hidden></label></div></form></details><section id="ownerReview" class="hidden"><div class="divider"></div><h3>Owner review queue</h3><p class="subtle">Signed in as the configured store owner.</p><div class="store-apps" id="reviewApps"></div></section><p class="subtle">Apps run in a sandboxed iframe. Install only code you trust.</p></div>`}
function wire(el,id){el.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.action){if(b.dataset.action==='close')close(id);if(b.dataset.action==='min')minimize(id);if(b.dataset.action==='max')maximize(id);return}if(id==='notepad')noteClick(b);if(id==='calculator'&&b.dataset.key)calcKey(b.dataset.key);if(id==='files')fileClick(b);if(id==='settings')settingsClick(b);if(id==='store')storeClick(b)});if(id==='notepad')bindNotes(el);if(id==='calculator')el.addEventListener('keydown',e=>{if(/^[0-9.+*/()%\-]$/.test(e.key))calcKey(({ '*':'×','/':'÷','-':'−'}[e.key]||e.key));else if(e.key==='Enter')calcKey('=');else if(e.key==='Backspace')calcKey('DEL');else if(e.key==='Escape')calcKey('AC')});if(id==='files')bindFiles(el,null);if(id==='settings')el.querySelector('#modeSelect').onchange=e=>{state.mode=e.target.value;save();apply()};if(id==='store')bindStore(el)}
function bindNotes(el){if(!selectedNote||!state.notes.some(n=>n.id===selectedNote))selectedNote=state.notes[0]?.id;let list=el.querySelector('#noteList');list.innerHTML=state.notes.map(n=>`<button class="note-item ${n.id===selectedNote?'selected':''}" data-note-id="${esc(n.id)}"><strong>${esc(n.title||'Untitled')}</strong><small>${new Date(n.updated||Date.now()).toLocaleDateString()}</small></button>`).join('')||'<div class="empty">No notes yet</div>';let n=state.notes.find(x=>x.id===selectedNote),title=el.querySelector('#noteTitle'),body=el.querySelector('#noteBody');if(n){title.value=n.title;body.value=n.content}let timer;for(let input of [title,body])input.addEventListener('input',()=>{let item=state.notes.find(x=>x.id===selectedNote);if(item){item.title=title.value;item.content=body.value;item.updated=Date.now()}clearTimeout(timer);timer=setTimeout(()=>{save();list.innerHTML=state.notes.map(x=>`<button class="note-item ${x.id===selectedNote?'selected':''}" data-note-id="${esc(x.id)}"><strong>${esc(x.title||'Untitled')}</strong><small>${new Date(x.updated).toLocaleDateString()}</small></button>`).join('')},300)})}
function noteClick(b){let w=windows.get('notepad');if(b.hasAttribute('data-note-new')){let n={id:uid(),title:'Untitled note',content:'',updated:Date.now()};state.notes.unshift(n);selectedNote=n.id;save();w.el.querySelector('.window-content').innerHTML=noteView();wire(w.el,'notepad')}else if(b.hasAttribute('data-note-delete')){if(!selectedNote)return;state.notes=state.notes.filter(n=>n.id!==selectedNote);selectedNote=state.notes[0]?.id||null;save();w.el.querySelector('.window-content').innerHTML=noteView();wire(w.el,'notepad')}else if(b.dataset.noteId){selectedNote=b.dataset.noteId;bindNotes(w.el)}}
function safeCalc(s){let t=s.match(/\d*\.?\d+|[()+\-*/]/g)||[];if(t.join('')!==s.replace(/\s/g,''))throw Error();let i=0;function factor(){if(t[i]==='-'){i++;return-factor()}if(t[i]==='+'){i++;return factor()}if(t[i]==='('){i++;let n=expr();if(t[i++]!==')')throw Error();return n}let n=Number(t[i++]);if(!Number.isFinite(n))throw Error();return n}function term(){let n=factor();while(t[i]==='*'||t[i]==='/'){let o=t[i++],r=factor();if(o==='/'&&r===0)throw Error();n=o==='*'?n*r:n/r}return n}function expr(){let n=term();while(t[i]==='+'||t[i]==='-'){let o=t[i++],r=term();n=o==='+'?n+r:n-r}return n}let n=expr();if(i!==t.length||!Number.isFinite(n))throw Error();return n}
function calcKey(k){let el=windows.get('calculator')?.el;if(!el)return;if(k==='AC'){calcInput='';el.querySelector('#calcExpr').textContent='';el.querySelector('#calcResult').textContent='0';return}if(k==='DEL')calcInput=calcInput.slice(0,-1);else if(k==='='){try{let r=safeCalc(calcInput);el.querySelector('#calcExpr').textContent=calcInput;calcInput=String(parseFloat(r.toPrecision(12)));el.querySelector('#calcResult').textContent=calcInput;return}catch{el.querySelector('#calcExpr').textContent='Invalid expression';return}}else calcInput+=({'×':'*','÷':'/','−':'-'}[k]||k);el.querySelector('#calcResult').textContent=calcInput||'0'}
function bindFiles(el,parent){let c=el.querySelector('.window-content');if(!c)return;c.innerHTML=filesView(parent)}
function fileClick(b){let el=windows.get('files')?.el,parent=folderStack.at(-1)||null;if(!el)return;if(b.hasAttribute('data-folder-new')||b.hasAttribute('data-file-new')){let folder=b.hasAttribute('data-folder-new'),name=prompt(folder?'Folder name':'Text file name',folder?'New folder':'New file.txt');if(name?.trim()){state.files.push({id:uid(),name:name.trim(),type:folder?'folder':'text',parent,content:''});save();bindFiles(el,parent)}return}if(b.hasAttribute('data-folder-up')){folderStack.pop();bindFiles(el,folderStack.at(-1)||null);return}let card=b.closest('[data-file-id]');if(!card)return;let f=state.files.find(x=>x.id===card.dataset.fileId);if(!f)return;if(b.hasAttribute('data-file-delete')){if(confirm(`Delete ${f.name}?`)){state.files=state.files.filter(x=>x.id!==f.id&&x.parent!==f.id);save();bindFiles(el,parent)}}else if(b.hasAttribute('data-file-rename')){let n=prompt('Rename file',f.name);if(n?.trim()){f.name=n.trim();save();bindFiles(el,parent)}}else if(f.type==='folder'){folderStack.push(f.id);bindFiles(el,f.id)}else editFile(el,f)}
function editFile(el,f){let c=el.querySelector('.window-content');c.innerHTML=`<div class="row between"><button class="button" data-file-back>Back to files</button><button class="button primary" data-file-save>Save</button></div><label class="field-label">File name</label><input id="fileName" class="field" value="${esc(f.name)}"><textarea id="fileText" class="field" style="height:calc(100% - 75px);margin-top:9px;resize:none">${esc(f.content)}</textarea>`;c.querySelector('[data-file-back]').onclick=()=>bindFiles(el,folderStack.at(-1)||null);c.querySelector('[data-file-save]').onclick=()=>{f.name=c.querySelector('#fileName').value;f.content=c.querySelector('#fileText').value;save();bindFiles(el,folderStack.at(-1)||null);toast('Virtual file saved')}}
function settingsClick(b){if(b.dataset.theme){state.theme=b.dataset.theme;save();apply()}if(b.dataset.wallpaper){state.wallpaper=b.dataset.wallpaper;save();apply()}if(b.hasAttribute('data-reset')&&confirm('Reset LightDesk data in this browser?')){localStorage.removeItem(KEY);state=defaults();save();for(let [id]of windows)close(id);apply()}}
function storeClick(b){if(b.hasAttribute('data-store-refresh'))refreshStore();if(b.dataset-download){let a=storeList.find(x=>x.id===b.dataset.download);if(a)installPublic(a)}if(b.dataset-approve||b.dataset-reject)reviewApp(b.dataset.approve||b.dataset.reject,b.dataset.approve?'approved':'rejected')}
function bindStore(el){el.querySelector('#submitForm').onsubmit=async e=>{e.preventDefault();let form=new FormData(e.currentTarget),name=String(form.get('name')).trim(),description=String(form.get('description')).trim(),html=String(form.get('html'));if(!name||!html.trim()||html.length>350000){toast('Name required; HTML must be under 350 KB.');return}try{let api=await firebaseReady(),user=api.auth.currentUser|| (await api.signInAnonymously(api.auth)).user;await api.addDoc(api.collection(api.db,'apps'),{name,description,html,status:'pending',ownerUid:user.uid,createdAt:api.serverTimestamp()});e.currentTarget.reset();toast('Submitted for review. It appears publicly after approval.');await refreshStore()}catch(err){console.error(err);toast('Submission failed. Check Firebase setup and Firestore rules.')}};el.querySelector('#uploadHtml').onchange=async e=>{let f=e.target.files?.[0];if(!f)return;let form=el.querySelector('#submitForm');form.elements.html.value=await f.text();if(!form.elements.name.value)form.elements.name.value=f.name.replace(/\.html$/i,'')};refreshStore()}
let firebaseCache=null,storeList=[];const firebaseConfig={apiKey:'AIzaSyA9LgxDNBDY5BPjwhBbldaHVoMAYI9y19',authDomain:'peak-app-storage.firebaseapp.com',projectId:'peak-app-storage',storageBucket:'peak-app-storage.firebasestorage.app',messagingSenderId:'420331576022',appId:'1:420331576022:web:f82e4b90fa3c4a72160777'};const OWNER_EMAIL='REPLACE_WITH_OWNER_EMAIL';
async function firebaseReady(){if(firebaseCache)return firebaseCache;firebaseCache=(async()=>{let [appSdk,dbSdk,authSdk]=await Promise.all([import('https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js'),import('https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js'),import('https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js')]);let app=appSdk.initializeApp(firebaseConfig),db=dbSdk.getFirestore(app),auth=authSdk.getAuth(app);return{...dbSdk,...authSdk,app,db,auth}})();try{return await firebaseCache}catch(e){firebaseCache=null;throw e}}
async function refreshStore(){let pub=$('#publicApps'),status=$('#authStatus');if(!pub)return;pub.innerHTML='<div class="empty">Connecting to Firebase…</div>';try{let api=await firebaseReady();let user=api.auth.currentUser;if(!user)user=(await api.signInAnonymously(api.auth)).user;let query=api.query(api.collection(api.db,'apps'),api.where('status','==','approved'));let snap=await api.getDocs(query);storeList=snap.docs.map(d=>({id:d.id,...d.data()}));pub.innerHTML=storeList.map(a=>`<article class="store-card"><span class="card-icon">${icon('store')}</span><h3>${esc(a.name)}</h3><p>${esc(a.description||'Community app')}</p><div class="row between"><span class="badge">Approved</span><button class="button primary" data-download="${esc(a.id)}">Download &amp; use</button></div></article>`).join('')||'<div class="empty">No approved apps yet.</div>';if(status){status.innerHTML=`<span>${user.isAnonymous?'Connected as guest':`Signed in: ${esc(user.email||'account')}`}</span> <button class="button" id="ownerLogin">Owner sign in</button>`;status.querySelector('#ownerLogin').onclick=ownerLogin}let owner=api.auth.currentUser?.email===OWNER_EMAIL,review=$('#ownerReview');if(review){review.classList.toggle('hidden',!owner);if(owner){let pending=await api.getDocs(api.query(api.collection(api.db,'apps'),api.where('status','==','pending'))),target=$('#reviewApps');target.innerHTML=pending.docs.map(d=>{let a=d.data();return`<article class="store-card"><h3>${esc(a.name)}</h3><p>${esc(a.description||'')}</p><button class="button" data-preview="${esc(d.id)}">View submitted HTML</button><div class="row" style="margin-top:8px"><button class="button primary" data-approve="${esc(d.id)}">Approve</button><button class="button danger" data-reject="${esc(d.id)}">Reject</button></div></article>`}).join('')||'<div class="empty">No submissions awaiting review.</div>';target.querySelectorAll('[data-preview]').forEach(btn=>btn.onclick=async()=>{let snap=await api.getDoc(api.doc(api.db,'apps',btn.dataset.preview));if(snap.exists()){let w=window.open();if(w){w.document.open();w.document.write('<pre>'+esc(snap.data().html)+'</pre>');w.document.close()}}})}}}catch(err){console.error(err);pub.innerHTML='<div class="status-error">The store could not connect. Enable Firebase Anonymous and Google sign-in, create Firestore, deploy the supplied rules, then serve this page over HTTPS or localhost.</div>';if(status)status.textContent='Firebase setup needed.'}}
async function ownerLogin(){try{let api=await firebaseReady(),provider=new api.GoogleAuthProvider();provider.setCustomParameters({prompt:'select_account'});await api.signInWithPopup(api.auth,provider);toast('Signed in. Loading review queue…');await refreshStore()}catch(e){console.error(e);toast('Owner sign-in failed. Check Google provider and authorized domains.')}}
async function reviewApp(id,status){try{let api=await firebaseReady();if(api.auth.currentUser?.email!==OWNER_EMAIL){toast('Sign in with the configured owner Google account.');return}await api.updateDoc(api.doc(api.db,'apps',id),{status,reviewedAt:api.serverTimestamp(),reviewedBy:api.auth.currentUser.email});toast(`Submission ${status}.`);await refreshStore()}catch(e){console.error(e);toast('Review denied. Verify owner email and deployed Firestore rules.')}}
function storeClick(b){if(b.hasAttribute('data-store-refresh'))refreshStore();if(b.dataset.download){let a=storeList.find(x=>x.id===b.dataset.download);if(a)installPublic(a)}if(b.dataset.approve)reviewApp(b.dataset.approve,'approved');if(b.dataset.reject)reviewApp(b.dataset.reject,'rejected')}
function installPublic(a){let item={id:a.id,name:a.name,description:a.description||'',html:a.html};if(!state.installed.some(x=>x.id===item.id))state.installed.push(item);save();renderAll();toast('Installed. Open the app from the desktop or launcher.')}
function openCustom(id){let a=state.installed.find(x=>x.id===id);if(!a)return;if(windows.has('custom:'+id)){restoreWindow('custom:'+id);return}if(mode()==='mobile'){for(let w of windows.values())w.el.remove();windows.clear();mobileApp='custom:'+id}let el=document.createElement('section'),wid='custom:'+id;el.className='window';el.dataset.id=wid;el.innerHTML=`<header class="window-header"><div class="window-title">${icon('store')}<span>${esc(a.name)}</span></div><div class="window-controls"><button data-action="min" aria-label="Minimize">${icon('min')}</button><button data-action="max" aria-label="Maximize">${icon('max')}</button><button class="close" data-action="close" aria-label="Close">${icon('close')}</button></div></header><div class="window-content" style="padding:0"><iframe title="${esc(a.name)}" sandbox="allow-scripts" style="width:100%;height:100%;border:0;background:white"></iframe></div>`;layer.append(el);el.querySelector('iframe').srcdoc=a.html;windows.set(wid,{el,app:{id:wid,name:a.name,icon:'store'}});focus(wid);drag(el);el.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b)return;if(b.dataset.action==='close')close(wid);if(b.dataset.action==='min')minimize(wid);if(b.dataset.action==='max')maximize(wid)});renderTasks();if(mode()==='mobile')$('#mobileHome').classList.add('hidden')}

$('#startButton').onclick=()=>startMenu.classList.toggle('open');$('#taskSettings').onclick=()=>openApp('settings');document.addEventListener('click',e=>{if(!e.target.closest('#startMenu,#startButton'))startMenu.classList.remove('open');let launch=e.target.closest('[data-open]');if(launch){openApp(launch.dataset.open);startMenu.classList.remove('open')}let task=e.target.closest('[data-task]');if(task){let w=windows.get(task.dataset.task);if(w&&!w.el.classList.contains('hidden'))minimize(task.dataset.task);else restoreWindow(task.dataset.task)}});document.addEventListener('dblclick',e=>{let b=e.target.closest('.desktop-icon');if(b)openApp(b.dataset.open)});document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();startMenu.classList.toggle('open')}if(e.key==='Escape')startMenu.classList.remove('open')});$('#mobileHomeButton').onclick=()=>{for(let w of windows.values())w.el.remove();windows.clear();active=null;mobileApp=null;$('#mobileHome').classList.remove('hidden');$('#mobileBack').disabled=true;renderTasks()};$('#mobileBack').onclick=()=>mobileApp?close(mobileApp):$('#mobileHome').classList.remove('hidden');$('#mobileRecent').onclick=()=>active?restoreWindow(active):$('#mobileHome').classList.remove('hidden');

window.addEventListener('resize',()=>document.documentElement.dataset.mode=mode());window.addEventListener('error',e=>{console.error(e.error);toast('LightDesk hit an error. Reload the page and check the browser console.')});renderAll();$('#mobileBack').disabled=true;setInterval(clock,15000);

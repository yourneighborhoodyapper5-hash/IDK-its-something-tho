<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b2028">
<meta name="description" content="LightDesk — a lightweight browser desktop.">
<title>LightDesk</title>
<style>
/* LightDesk: original desktop styling with familiar, restrained desktop conventions. */
:root{color-scheme:dark;--wall:#25384a;--wall-image:linear-gradient(135deg,#182a36,#385162 55%,#213b48);--task:#171a20;--panel:#242830;--panel2:#2e333d;--surface:#20232a;--text:#f1f2f4;--muted:#b7bbc3;--line:#ffffff22;--accent:#67b9e8;--accent-ink:#101820;--shadow:0 16px 42px #0008;font:14px/1.45 "Segoe UI",system-ui,-apple-system,sans-serif}

:root[data-theme="blue"]{--accent:#68bdf0;--wall-image:linear-gradient(135deg,#132c45,#1c5c82 55%,#17384f)}
:root[data-theme="purple"]{--accent:#c09bea;--wall-image:linear-gradient(135deg,#302242,#614478 55%,#392c50)}
:root[data-theme="green"]{--accent:#68c99b;--wall-image:linear-gradient(135deg,#18392f,#27634c 55%,#20483f)}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{color:var(--text);background:var(--wall-image)}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}.shell{position:relative;width:100%;height:100%;overflow:hidden;background:var(--wall-image)}
/* Desktop surface */
.desktop{position:absolute;inset:0 0 48px;overflow:hidden}.desktop-brand{position:absolute;top:13px;left:18px;color:#fff;font-weight:650;text-shadow:0 1px 3px #0008;display:flex;align-items:center;gap:8px}.brand-glyph{width:25px;height:25px;border-radius:6px;display:grid;place-items:center;background:#ffffff23;border:1px solid #ffffff3b}.brand-glyph svg{width:16px;height:16px}.desktop-icons{position:absolute;left:14px;top:54px;display:grid;grid-auto-flow:row;grid-template-columns:76px;gap:5px}.desktop-icon{width:72px;min-height:72px;padding:6px 3px;border:1px solid transparent;border-radius:5px;background:transparent;color:#fff;text-shadow:0 1px 4px #000b;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:12px}.desktop-icon:hover,.desktop-icon:focus-visible{background:#ffffff20;border-color:#ffffff20}.app-glyph{width:38px;height:38px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(145deg,#ffffff34,#ffffff15);border:1px solid #ffffff30;color:#fff}.app-glyph svg{width:22px;height:22px}
/* Bottom taskbar */
.taskbar{height:48px;position:absolute;z-index:1000;left:0;right:0;bottom:0;padding:4px 10px;display:flex;align-items:center;gap:7px;background:var(--task);border-top:1px solid #ffffff1a;color:#f4f5f7}.task-left,.task-right,.task-apps{height:100%;display:flex;align-items:center;gap:3px}.task-right{margin-left:auto}.task-apps{min-width:0;overflow-x:auto}.task-btn,.start-btn,.tray-btn,.mobile-nav button{height:38px;min-width:40px;padding:0 9px;border:0;border-radius:4px;background:transparent;color:inherit;display:flex;align-items:center;justify-content:center;gap:8px}.task-btn:hover,.start-btn:hover,.tray-btn:hover{background:#ffffff1c}.start-btn{min-width:44px;color:#fff}.start-btn svg{color:#72c9ef}.task-btn{position:relative}.task-btn.active:after{content:"";position:absolute;bottom:0;left:25%;right:25%;height:3px;background:var(--accent);border-radius:2px}.clock{min-width:80px;text-align:center;font-size:12px;line-height:1.2}.clock small{display:block;font-size:11px;opacity:.78}.taskbar .tray-label{font-size:11px;opacity:.8}

/* Launcher */
.start-menu{display:none;position:absolute;z-index:1200;left:8px;bottom:54px;width:min(390px,calc(100vw - 16px));max-height:min(70vh,600px);overflow:auto;padding:16px;background:var(--panel);border:1px solid var(--line);border-radius:7px;box-shadow:var(--shadow)}.start-menu.open{display:block;animation:openwin .12s ease-out}.start-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.start-grid,.app-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:5px}.launch-card{min-height:82px;border:1px solid transparent;border-radius:5px;background:transparent;color:var(--text);padding:9px 5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}.launch-card:hover{background:var(--panel2);border-color:var(--line)}.launch-card .app-glyph{background:color-mix(in srgb,var(--accent) 18%,var(--panel));color:var(--accent);border-color:var(--line)}
/* Shared app controls */
.mobile-status,.mobile-nav,.mobile-home{display:none}.section-title{font-size:19px;margin:0 0 5px}.subtle{color:var(--muted)}.row{display:flex;align-items:center;gap:8px}.between{justify-content:space-between}.button{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:4px;padding:8px 11px;font-weight:550}.button:hover{filter:brightness(1.08)}.button.primary{background:var(--accent);border-color:transparent;color:var(--accent-ink)}.button.danger{color:#ff838c}.field{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:9px 10px}.field-label{display:block;margin:11px 0 5px;color:var(--muted);font-size:12px;font-weight:600}.divider{height:1px;background:var(--line);margin:13px 0}.empty{padding:25px;text-align:center;color:var(--muted)}
/* Notepad */
.note-layout{height:calc(100% - 39px);min-height:170px;display:grid;grid-template-columns:175px 1fr;border:1px solid var(--line);border-radius:4px;overflow:hidden}.note-list{background:var(--surface);border-right:1px solid var(--line);overflow:auto;padding:5px}.note-item{display:block;width:100%;padding:9px 8px;text-align:left;background:transparent;border:0;border-radius:3px;color:var(--text)}.note-item.selected,.note-item:hover{background:color-mix(in srgb,var(--accent) 17%,var(--surface))}.note-item strong,.note-item small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.note-item small{margin-top:3px;font-size:11px;color:var(--muted)}.note-editor{min-height:0;display:flex;flex-direction:column;padding:7px}.note-title{padding:7px;border:0;background:transparent;font-size:19px;font-weight:650}.note-body{flex:1;min-height:100px;padding:7px;border:0;background:transparent;resize:none;line-height:1.7}
/* Calculator and files */
.calc{max-width:360px;margin:auto}.calc-display{height:78px;margin-bottom:9px;padding:9px;display:flex;flex-direction:column;justify-content:end;align-items:end;background:var(--surface);border:1px solid var(--line);border-radius:4px}.calc-result{max-width:100%;overflow:hidden;font-size:30px}.calc-expression{min-height:20px;color:var(--muted)}.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.calc-key{height:48px;border:1px solid var(--line);border-radius:4px;background:var(--surface2);font-size:17px}.calc-key:hover{background:color-mix(in srgb,var(--accent) 18%,var(--surface2))}.calc-key.op{color:var(--accent)}.calc-key.equal{background:var(--accent);color:var(--accent-ink)}.file-toolbar{display:flex;gap:6px;flex-wrap:wrap}.file-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:8px;margin-top:13px}.file-card{min-width:0;padding:11px;background:var(--surface);border:1px solid var(--line);border-radius:4px}.file-card>svg{display:block;margin-bottom:7px;color:var(--accent)}.file-card small{display:block;color:var(--muted)}.file-actions{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}.file-actions .button{padding:5px 7px;font-size:11px}
/* Settings and app catalog */
.settings-grid,.store-apps{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:9px}.settings-card,.store-card,.about-card{padding:13px;background:var(--surface);border:1px solid var(--line);border-radius:5px}.settings-card h3,.store-card h3{margin:0 0 5px;font-size:14px}.settings-card p,.store-card p{margin:0 0 10px;color:var(--muted);font-size:12px}.settings-card{margin-top:9px}.store-layout{display:flex;flex-direction:column;gap:11px}.store-card{display:flex;flex-direction:column;min-height:150px}.store-card p{flex:1}.store-card .row{justify-content:space-between}.card-icon{width:38px;height:38px;margin-bottom:8px;display:grid;place-items:center;border-radius:6px;background:color-mix(in srgb,var(--accent) 18%,var(--surface));color:var(--accent)}.badge{padding:3px 7px;border-radius:3px;background:color-mix(in srgb,var(--accent) 18%,var(--surface));color:var(--accent);font-size:11px}.store-form{padding:13px;background:var(--surface);border:1px solid var(--line);border-radius:5px}.store-form textarea{min-height:110px;resize:vertical}.status-error{padding:12px;border:1px solid #d3545d;background:#852e3833;border-radius:5px}.toast{position:absolute;z-index:1400;left:50%;bottom:58px;transform:translateX(-50%);padding:10px 15px;border-radius:4px;background:#15191f;color:white;box-shadow:var(--shadow)}.hidden{display:none!important}
/* Tablet mode */
:root[data-mode="tablet"] .desktop{inset-bottom:62px}:root[data-mode="tablet"] .taskbar{height:62px;justify-content:center}:root[data-mode="tablet"] .window-layer{bottom:62px}:root[data-mode="tablet"] .desktop-icons{grid-template-columns:repeat(2,78px)}:root[data-mode="tablet"] .window{left:10%;width:min(820px,80vw);height:min(650px,76vh)}:root[data-mode="tablet"] .task-btn,:root[data-mode="tablet"] .start-btn{height:48px;min-width:48px}
/* Phone home screen and full-screen apps */
:root[data-mode="mobile"] .desktop{inset:0;padding:0;background:#14202c30}:root[data-mode="mobile"] .desktop-brand,:root[data-mode="mobile"] .desktop-icons,:root[data-mode="mobile"] .taskbar,:root[data-mode="mobile"] .start-menu{display:none!important}:root[data-mode="mobile"] .mobile-status{position:absolute;z-index:5;inset:0 0 auto;height:39px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;color:white;text-shadow:0 1px 3px #000;font-size:12px;background:#11172222}:root[data-mode="mobile"] .mobile-home{position:absolute;inset:39px 0 66px;display:block;overflow:auto;padding:19px;color:white}:root[data-mode="mobile"] .mobile-home h1{margin:10px 0 4px;font-size:26px}:root[data-mode="mobile"] .mobile-home .app-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:20px}:root[data-mode="mobile"] .mobile-home .launch-card{min-height:83px;padding:6px 2px;color:white;font-size:11px}:root[data-mode="mobile"] .mobile-home .app-glyph{width:48px;height:48px;border-radius:12px;background:#ffffff2b;color:white;border-color:#ffffff45}:root[data-mode="mobile"] .mobile-nav{position:absolute;z-index:1200;inset:auto 0 0;height:66px;padding-bottom:env(safe-area-inset-bottom);display:flex;align-items:center;justify-content:space-around;background:#171a20;border-top:1px solid #ffffff22;color:white}:root[data-mode="mobile"] .mobile-nav button{min-width:56px;height:50px}:root[data-mode="mobile"] .window-layer{inset:39px 0 66px;z-index:50}:root[data-mode="mobile"] .window{inset:0!important;left:0!important;top:0!important;right:0!important;bottom:0!important;width:100%!important;height:100%!important;min-width:0;min-height:0;resize:none;border:0;border-radius:0;box-shadow:none;animation:none}:root[data-mode="mobile"] .window-header{height:47px}:root[data-mode="mobile"] .window-controls button:not(.close){display:none}:root[data-mode="mobile"] .window-content{padding:12px}:root[data-mode="mobile"] .note-layout{grid-template-columns:105px 1fr}:root[data-mode="mobile"] .window.maximized{inset:0!important}
@media(max-width:560px){.window-content{padding:11px}.file-list{grid-template-columns:1fr 1fr}.note-layout{grid-template-columns:100px 1fr}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>

<body>
<div class="shell" id="shell">
 <header class="desktop-brand"><span class="brand-glyph" id="brandGlyph"></span><span>LightDesk</span></header>
 <main class="desktop" aria-label="LightDesk desktop">
  <div class="desktop-icons" id="desktopIcons"></div>
  <div class="mobile-status"><span id="mobileTime"></span><span>Connected &nbsp; ▰</span></div>
  <section class="mobile-home" id="mobileHome"><h1>Good day.</h1><div class="subtle" id="mobileDate"></div><div class="app-grid" id="mobileApps"></div></section>
  <div class="window-layer" id="windowLayer"></div>
 </main>
 <nav class="taskbar" aria-label="Taskbar"><div class="task-left"><button class="start-btn" id="startButton" aria-label="Open app menu" title="Applications"></button><div class="task-apps" id="taskApps"></div></div><div class="task-right"><span class="tray-label">LightDesk</span><button class="tray-btn" id="taskSettings" aria-label="Settings" title="Settings"></button><div class="clock" id="clock"></div></div></nav>
 <aside class="start-menu" id="startMenu" aria-label="Application menu"><div class="start-head"><strong>Applications</strong><span class="subtle">LightDesk</span></div><div class="start-grid" id="startGrid"></div><div class="divider"></div><button class="button" data-open="settings">Open Settings</button></aside>
 <nav class="mobile-nav" aria-label="Phone navigation"><button id="mobileBack" aria-label="Back"></button><button id="mobileHomeButton" aria-label="Home"></button><button id="mobileRecent" aria-label="Recent apps"></button></nav>
</div>
<script>
(()=>{'use strict';
const KEY='lightdesk-stable-v1';
const PATHS={home:'<path d="M3 10.5 12 3l9 7.5M5.5 9.5V21h13V9.5M9.5 21v-7h5v7"/>',note:'<path d="M6 3h9l4 4v14H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z"/><path d="M14 3v5h5M8 12h8M8 16h8"/>',calc:'<rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 6h8v4H8zM8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01M16 18h.01"/>',folder:'<path d="M3 6a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M19 13a7 7 0 0 0 0-2l2-1.5-2-3.5-2.4 1a7 7 0 0 0-1.7-1L14.5 3h-5L9 6a7 7 0 0 0-1.7 1l-2.4-1-2 3.5L5 11a7 7 0 0 0 0 2l-2.1 1.5 2 3.5 2.4-1a7 7 0 0 0 1.7 1l.5 3h5l.5-3a7 7 0 0 0 1.7-1l2.4 1 2-3.5z" transform="translate(1 0) scale(.9)"/>',store:'<path d="M4 8h16l-1 12H5L4 8Z"/><path d="M8 8V6a4 4 0 0 1 8 0v2"/>',about:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',close:'<path d="m6 6 12 12M18 6 6 18"/>',min:'<path d="M5 12h14"/>',max:'<rect x="5" y="5" width="14" height="14" rx="1"/>',restore:'<path d="M8 8V5h11v11h-3M5 8h11v11H5z"/>',back:'<path d="m15 18-6-6 6-6"/>',recent:'<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 9h8M8 13h5"/>'};
const icon=n=>`<svg viewBox="0 0 24 24" aria-hidden="true">${PATHS[n]||PATHS.about}</svg>`;
const APPS=[{id:'notepad',name:'Notepad',icon:'note',desc:'Create and autosave notes.'},{id:'calculator',name:'Calculator',icon:'calc',desc:'Basic arithmetic with keyboard support.'},{id:'files',name:'Files',icon:'folder',desc:'Manage simulated folders and files.'},{id:'settings',name:'Settings',icon:'settings',desc:'Choose theme and device layout.'},{id:'store',name:'App Store',icon:'store',desc:'Browse and submit apps.'},{id:'about',name:'About',icon:'about',desc:'About LightDesk.'}];
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,10),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function defaults(){return{theme:'dark',mode:'auto',wallpaper:'aurora',notes:[{id:uid(),title:'Welcome to LightDesk',content:'Your notes and preferences are saved in this browser.',updated:Date.now()}],files:[{id:uid(),name:'Documents',type:'folder',parent:null,content:''},{id:uid(),name:'Welcome.txt',type:'text',parent:null,content:'This is a virtual file stored in this browser.'}],positions:{},installed:[]}}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(!d||typeof d!=='object')return defaults();const f=defaults();return{...f,...d,notes:Array.isArray(d.notes)?d.notes:f.notes,files:Array.isArray(d.files)?d.files:f.files,installed:Array.isArray(d.installed)?d.installed:[],positions:d.positions&&typeof d.positions==='object'?d.positions:{}}}catch{return defaults()}}
let state=load(),windows=new Map(),z=10,activeId=null,mobileId=null,selectedNote=null,calcInput='',folderPath=[],editingFileId=null,storeApps=[];
const wallpapers={aurora:'linear-gradient(135deg,#182a36,#385162 55%,#213b48)',dusk:'linear-gradient(135deg,#362335,#754b58 55%,#47364c)',ocean:'linear-gradient(135deg,#142c40,#236485 55%,#183c49)',plain:'linear-gradient(135deg,#424b52,#626b70)'};
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{toast('Unable to save: browser storage may be full.')}}
function mode(){if(state.mode&&state.mode!=='auto')return state.mode;const width=innerWidth,coarse=matchMedia('(pointer:coarse)').matches||navigator.maxTouchPoints>0;return width<700?'mobile':width<1050&&coarse?'tablet':'desktop'}
function syncAppearance(){document.documentElement.dataset.theme=state.theme||'dark';document.documentElement.dataset.mode=mode();document.documentElement.style.setProperty('--wall-image',wallpapers[state.wallpaper]||wallpapers.aurora)}
const desktopIcons=$('#desktopIcons'),startGrid=$('#startGrid'),mobileApps=$('#mobileApps'),layer=$('#windowLayer'),taskApps=$('#taskApps'),startMenu=$('#startMenu');
function allApps(){return[...APPS,...state.installed.map(a=>({id:'custom:'+a.id,name:a.name,icon:'store',desc:a.description||''}))]}
function appTile(a){return`<button class="launch-card" data-open="${esc(a.id)}" aria-label="Open ${esc(a.name)}"><span class="app-glyph">${icon(a.icon)}</span><span>${esc(a.name)}</span></button>`}
function renderChrome(){const apps=allApps();$('#brandGlyph').innerHTML=icon('home');$('#startButton').innerHTML=icon('home');$('#taskSettings').innerHTML=icon('settings');$('#mobileBack').innerHTML=icon('back');$('#mobileHomeButton').innerHTML=icon('home');$('#mobileRecent').innerHTML=icon('recent');desktopIcons.innerHTML=apps.map(a=>`<button class="desktop-icon" data-open="${esc(a.id)}" aria-label="Open ${esc(a.name)}"><span class="app-glyph">${icon(a.icon)}</span><span>${esc(a.name)}</span></button>`).join('');startGrid.innerHTML=apps.map(appTile).join('');mobileApps.innerHTML=apps.map(appTile).join('');syncAppearance();renderTasks();updateClock()}
function appFor(id){return id.startsWith('custom:')?state.installed.find(a=>'custom:'+a.id===id):APPS.find(a=>a.id===id)}
function openApp(id){const app=appFor(id);if(!app)return;if(windows.has(id)){restore(id);return}if(mode()==='mobile'){for(const w of windows.values())w.el.remove();windows.clear();mobileId=id}const el=document.createElement('section');el.className='window';el.dataset.id=id;el.setAttribute('role','dialog');el.setAttribute('aria-label',app.name);const p=state.positions[id];if(p&&mode()!=='mobile'){el.style.left=p.x+'px';el.style.top=p.y+'px';if(p.w)el.style.width=p.w+'px';if(p.h)el.style.height=p.h+'px'}el.innerHTML=`<header class="window-header"><div class="window-title">${icon(app.icon)}<span>${esc(app.name)}</span></div><div class="window-controls"><button data-action="min" title="Minimize" aria-label="Minimize">${icon('min')}</button><button data-action="max" title="Maximize or restore" aria-label="Maximize">${icon('max')}</button><button class="close" data-action="close" title="Close" aria-label="Close">${icon('close')}</button></div></header><div class="window-content">${appView(id)}</div>`;layer.append(el);windows.set(id,{el,app});focus(id);renderTasks();if(id==='notepad')renderNoteList();if(id==='files')renderFiles();if(id==='store')loadStore();if(mode()==='mobile'){$('#mobileHome').classList.add('hidden');$('#mobileBack').disabled=false}}
function focus(id){const record=windows.get(id);if(!record)return;for(const item of windows.values())item.el.classList.remove('focused');record.el.classList.remove('hidden');record.el.classList.add('focused');record.el.style.zIndex=++z;activeId=id;renderTasks()}
function closeWindow(id){const record=windows.get(id);if(!record)return;record.el.remove();windows.delete(id);if(activeId===id)activeId=[...windows.keys()].at(-1)||null;if(mobileId===id)mobileId=null;renderTasks();if(mode()==='mobile'&&!mobileId){$('#mobileHome').classList.remove('hidden');$('#mobileBack').disabled=true}}
function minimize(id){const record=windows.get(id);if(!record)return;record.el.classList.add('hidden');if(activeId===id)activeId=null;renderTasks()}
function restore(id){const record=windows.get(id);if(!record)return;record.el.classList.remove('hidden','maximized');focus(id)}
function maximize(id){const record=windows.get(id);if(!record)return;const on=record.el.classList.toggle('maximized');const button=record.el.querySelector('[data-action="max"]');button.innerHTML=icon(on?'restore':'max');button.setAttribute('aria-label',on?'Restore window':'Maximize window');button.title=on?'Restore':'Maximize'}
function renderTasks(){taskApps.innerHTML=[...windows].map(([id,w])=>`<button class="task-btn ${id===activeId&&!w.el.classList.contains('hidden')?'active':''}" data-task="${esc(id)}" aria-label="${esc(w.app.name)}" title="${esc(w.app.name)}">${icon(w.app.icon)}</button>`).join('')}
function appView(id){if(id.startsWith('custom:'))return customView(id.slice(7));switch(id){case'notepad':return noteView();case'calculator':return calcView();case'files':return filesView(null);case'settings':return settingsView();case'store':return storeView();case'about':return aboutView();default:return'<p>Application not found.</p>'}}
function noteView(){let note=state.notes.find(n=>n.id===selectedNote)||state.notes[0];selectedNote=note?.id||null;return`<div class="row between" style="margin-bottom:8px"><span class="subtle">Notes save automatically on this device.</span><div class="row"><button class="button" data-note-new>New note</button><button class="button danger" data-note-delete>Delete</button></div></div><div class="note-layout"><aside class="note-list" id="noteList"></aside><div class="note-editor"><input class="note-title" id="noteTitle" aria-label="Note title" placeholder="Untitled note" value="${esc(note?.title||'')}"><textarea class="note-body" id="noteBody" aria-label="Note contents" placeholder="Start writing…">${esc(note?.content||'')}</textarea></div></div>`}
function renderNoteList(){const el=windows.get('notepad')?.el.querySelector('#noteList');if(!el)return;el.innerHTML=state.notes.map(n=>`<button class="note-item ${n.id===selectedNote?'selected':''}" data-note-select="${esc(n.id)}"><strong>${esc(n.title||'Untitled note')}</strong><small>${new Date(n.updated||Date.now()).toLocaleDateString()}</small></button>`).join('')||'<p class="empty">No notes yet.</p>'}
function calcView(){return`<div class="calc"><div class="calc-display"><div class="calc-expression" id="calcExpression"></div><div class="calc-result" id="calcResult">0</div></div><div class="calc-grid">${['AC','DEL','(',')','7','8','9','÷','4','5','6','×','1','2','3','−','0','.','=','+'].map(k=>`<button class="calc-key ${'÷×−+'.includes(k)?'op':''} ${k==='='?'equal':''}" data-key="${k}" aria-label="${k==='AC'?'Clear':k}">${k}</button>`).join('')}</div></div>`}
function filesView(parent){const entries=state.files.filter(f=>(f.parent||null)===(parent||null));return`<div class="row between"><div><h2 class="section-title">Files</h2><span class="subtle">Virtual files saved in this browser (not your computer’s filesystem).</span></div><div class="file-toolbar"><button class="button" data-folder-new>New folder</button><button class="button primary" data-file-new>New text file</button></div></div>${parent?'<button class="button" style="margin-top:10px" data-folder-up>Back</button>':''}<div class="file-list">${entries.map(f=>`<article class="file-card" data-file-id="${esc(f.id)}">${icon(f.type==='folder'?'folder':'note')}<strong>${esc(f.name)}</strong><small>${f.type==='folder'?'Folder':'Text file'}</small><div class="file-actions"><button class="button" data-file-open>${f.type==='folder'?'Open':'Edit'}</button><button class="button" data-file-rename>Rename</button><button class="button danger" data-file-delete>Delete</button></div></article>`).join('')||'<div class="empty">This folder is empty.</div>'}</div>`}
function renderFiles(){const content=windows.get('files')?.el.querySelector('.window-content');if(content)content.innerHTML=filesView(folderPath.at(-1)||null)}
function settingsView(){return`<h2 class="section-title">Settings</h2><p class="subtle">Changes apply immediately and are saved in this browser.</p><div class="settings-grid"><section class="settings-card"><h3>Theme</h3><p>Choose a color palette.</p>${['dark','light','blue','purple','green'].map(t=>`<button class="button" data-theme="${t}" aria-pressed="${state.theme===t}">${t[0].toUpperCase()+t.slice(1)}</button> `).join('')}</section><section class="settings-card"><h3>Wallpaper</h3><p>Choose a desktop background.</p>${[['aurora','Slate'],['dusk','Dusk'],['ocean','Harbor'],['plain','Plain']].map(([v,n])=>`<button class="button" data-wallpaper="${v}" aria-pressed="${state.wallpaper===v}">${n}</button> `).join('')}</section><section class="settings-card"><h3>Interface mode</h3><p>Automatic uses available width and touch input.</p><select class="field" data-mode-select aria-label="Interface mode">${[['auto','Automatic'],['desktop','Desktop'],['tablet','Tablet'],['mobile','Mobile']].map(([v,n])=>`<option value="${v}" ${state.mode===v?'selected':''}>${n}</option>`).join('')}</select></section><section class="settings-card"><h3>Reset</h3><p>Clear LightDesk preferences, notes and local apps.</p><button class="button danger" data-reset>Reset saved data</button></section></div>`}
function aboutView(){return`<div class="about-card"><h2 class="section-title">LightDesk</h2><p>Version 1.3 — a lightweight browser desktop with desktop, tablet and phone layouts.</p><p>Notes, preferences and simulated files are stored in your browser. App Store listings use Firebase when configured.</p><a href="https://github.com/" target="_blank" rel="noreferrer">GitHub repository</a></div>`}
function storeView(){return`<div class="store-layout"><div class="row between"><div><h2 class="section-title">App Store</h2><p class="subtle">Approved HTML app packages appear here for everyone.</p></div><button class="button" data-store-refresh>Refresh</button></div><div id="storeStatus" class="subtle">Connecting to store…</div><div class="store-apps" id="publicApps"></div><div class="divider"></div><details><summary>Submit an app for review</summary><p class="subtle">Submissions remain pending until the store owner approves them.</p><form id="submitForm" class="store-form"><label class="field-label">App name</label><input class="field" name="name" maxlength="48" required><label class="field-label">Description</label><input class="field" name="description" maxlength="160"><label class="field-label">HTML source (max 350 KB)</label><textarea class="field" name="html" required></textarea><div class="row" style="margin-top:10px"><button class="button primary">Submit</button><label class="button">Choose HTML file<input id="htmlUpload" type="file" accept=".html,text/html" hidden></label></div></form></details><section id="reviewPanel" class="hidden"><div class="divider"></div><h3>Owner review queue</h3><div class="store-apps" id="reviewList"></div></section><p class="subtle">Apps run in a sandboxed frame. Install only code you trust.</p></div>`}
function customView(id){const app=state.installed.find(x=>x.id===id);return app?`<iframe title="${esc(app.name)}" sandbox="allow-scripts" srcdoc="${esc(app.html)}" style="width:100%;height:100%;min-height:350px;border:0;background:#fff"></iframe>`:'<p>App not found.</p>'}
/* One delegated click handler: app views can rerender without multiplying listeners. */
$('#shell').addEventListener('click',event=>{const target=event.target;const button=target.closest('button');if(!button)return;
 if(button.id==='startButton'){startMenu.classList.toggle('open');return}
 if(button.id==='taskSettings'){openApp('settings');return}
 if(button.id==='mobileHomeButton'){for(const [id,w] of windows){w.el.remove()}windows.clear();activeId=null;mobileId=null;$('#mobileHome').classList.remove('hidden');$('#mobileBack').disabled=true;renderTasks();return}
 if(button.id==='mobileBack'){if(mobileId)closeWindow(mobileId);else $('#mobileHome').classList.remove('hidden');return}
 if(button.id==='mobileRecent'){if(activeId)restore(activeId);return}
 if(button.dataset.open){openApp(button.dataset.open);startMenu.classList.remove('open');return}
 if(button.dataset.task){const rec=windows.get(button.dataset.task);if(rec&&!rec.el.classList.contains('hidden'))minimize(button.dataset.task);else restore(button.dataset.task);return}
 const win=button.closest('.window'),id=win?.dataset.id;if(!id)return;
 if(button.dataset.action){if(button.dataset.action==='close')closeWindow(id);else if(button.dataset.action==='min')minimize(id);else if(button.dataset.action==='max')maximize(id);return}
 if(id==='notepad')handleNoteButton(button);else if(id==='calculator'&&button.dataset.key)calculatorKey(button.dataset.key);else if(id==='files')handleFileButton(button);else if(id==='settings')handleSetting(button);else if(id==='store')handleStoreButton(button);
});
$('#shell').addEventListener('input',event=>{const el=event.target,win=el.closest('.window');if(win?.dataset.id==='notepad'&&(el.id==='noteTitle'||el.id==='noteBody')){let note=state.notes.find(n=>n.id===selectedNote);if(!note)return;note.title=win.querySelector('#noteTitle').value;note.content=win.querySelector('#noteBody').value;note.updated=Date.now();save();renderNoteList()}});
$('#shell').addEventListener('change',event=>{if(event.target.matches('[data-mode-select]')){state.mode=event.target.value;save();syncAppearance();return}if(event.target.id==='htmlUpload'){const file=event.target.files?.[0];if(file){const form=event.target.closest('form');file.text().then(text=>{form.elements.html.value=text;if(!form.elements.name.value)form.elements.name.value=file.name.replace(/\.html$/i,'')})}}});
$('#shell').addEventListener('keydown',event=>{const win=event.target.closest('.window');if(win?.dataset.id==='calculator'){if(/^[0-9.+*/()%\-]$/.test(event.key)){event.preventDefault();calculatorKey(({ '*':'×','/':'÷','-':'−'}[event.key]||event.key))}else if(event.key==='Enter'){event.preventDefault();calculatorKey('=')}else if(event.key==='Backspace'&&event.target.tagName!=='INPUT'){event.preventDefault();calculatorKey('DEL')}else if(event.key==='Escape')calculatorKey('AC')}if(event.key==='Escape')startMenu.classList.remove('open')});
$('#shell').addEventListener('pointerdown',event=>{const win=event.target.closest('.window');if(!win)return;focus(win.dataset.id);const bar=event.target.closest('.window-header');if(!bar||event.target.closest('button')||mode()==='mobile'||win.classList.contains('maximized'))return;const r=win.getBoundingClientRect(),sx=event.clientX,sy=event.clientY;bar.setPointerCapture(event.pointerId);const move=e=>{win.style.left=Math.max(0,Math.min(innerWidth-win.offsetWidth,r.left+e.clientX-sx))+'px';win.style.top=Math.max(0,Math.min(innerHeight-win.offsetHeight-48,r.top+e.clientY-sy))+'px'};const end=()=>{bar.removeEventListener('pointermove',move);bar.removeEventListener('pointerup',end);const now=win.getBoundingClientRect();state.positions[win.dataset.id]={x:now.left,y:now.top,w:now.width,h:now.height};save()};bar.addEventListener('pointermove',move);bar.addEventListener('pointerup',end,{once:true})});
document.addEventListener('click',event=>{if(!event.target.closest('#startMenu,#startButton'))startMenu.classList.remove('open')});document.addEventListener('keydown',event=>{if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='k'){event.preventDefault();startMenu.classList.toggle('open')}});
function handleSetting(button){if(button.dataset.theme){state.theme=button.dataset.theme;save();syncAppearance();const win=windows.get('settings')?.el;if(win)win.querySelectorAll('[data-theme]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.theme===state.theme)))}else if(button.dataset.wallpaper){state.wallpaper=button.dataset.wallpaper;save();syncAppearance();const win=windows.get('settings')?.el;if(win)win.querySelectorAll('[data-wallpaper]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.wallpaper===state.wallpaper)))}else if(button.hasAttribute('data-reset')){if(confirm('Reset LightDesk data saved in this browser?')){localStorage.removeItem(KEY);state=defaults();folderPath=[];selectedNote=null;for(const [id,w] of windows){w.el.remove()}windows.clear();activeId=null;mobileId=null;save();renderChrome();toast('Saved LightDesk data reset.')}}}
function handleNoteButton(button){if(button.hasAttribute('data-note-new')){const n={id:uid(),title:'Untitled note',content:'',updated:Date.now()};state.notes.unshift(n);selectedNote=n.id;save();const content=windows.get('notepad').el.querySelector('.window-content');content.innerHTML=noteView();renderNoteList()}else if(button.hasAttribute('data-note-delete')){if(!selectedNote)return;state.notes=state.notes.filter(n=>n.id!==selectedNote);selectedNote=state.notes[0]?.id||null;save();const content=windows.get('notepad').el.querySelector('.window-content');content.innerHTML=noteView();renderNoteList()}else if(button.dataset.noteSelect){selectedNote=button.dataset.noteSelect;const rec=windows.get('notepad'),n=state.notes.find(x=>x.id===selectedNote);if(n){rec.el.querySelector('#noteTitle').value=n.title;rec.el.querySelector('#noteBody').value=n.content}renderNoteList()}}
function safeCalculate(source){const tokens=source.match(/\d*\.?\d+|[()+\-*/]/g)||[];if(!tokens.length||tokens.join('')!==source.replace(/\s/g,''))throw Error('Invalid input');let i=0;function factor(){if(tokens[i]==='-'){i++;return-factor()}if(tokens[i]==='+'){i++;return factor()}if(tokens[i]==='('){i++;const v=expr();if(tokens[i++]!==')')throw Error('Missing )');return v}const n=Number(tokens[i++]);if(!Number.isFinite(n))throw Error('Invalid number');return n}function term(){let v=factor();while(tokens[i]==='*'||tokens[i]==='/'){const op=tokens[i++],r=factor();if(op==='/'&&r===0)throw Error('Divide by zero');v=op==='*'?v*r:v/r}return v}function expr(){let v=term();while(tokens[i]==='+'||tokens[i]==='-'){const op=tokens[i++],r=term();v=op==='+'?v+r:v-r}return v}const result=expr();if(i!==tokens.length||!Number.isFinite(result))throw Error('Invalid expression');return result}
function calculatorKey(key){const win=windows.get('calculator')?.el;if(!win)return;if(key==='AC'){calcInput='';win.querySelector('#calcExpression').textContent='';win.querySelector('#calcResult').textContent='0';return}if(key==='DEL')calcInput=calcInput.slice(0,-1);else if(key==='='){try{const answer=safeCalculate(calcInput);win.querySelector('#calcExpression').textContent=calcInput;calcInput=String(Number(answer.toPrecision(12)));win.querySelector('#calcResult').textContent=calcInput;return}catch{win.querySelector('#calcExpression').textContent='Invalid expression';return}}else calcInput+=({'×':'*','÷':'/','−':'-'}[key]||key);win.querySelector('#calcResult').textContent=calcInput||'0'}
function handleFileButton(button){const win=windows.get('files')?.el,parent=folderPath.at(-1)||null;if(!win)return;if(button.hasAttribute('data-folder-new')||button.hasAttribute('data-file-new')){const folder=button.hasAttribute('data-folder-new'),name=prompt(folder?'New folder name':'New text file name',folder?'New folder':'New file.txt');if(name?.trim()){state.files.push({id:uid(),name:name.trim(),type:folder?'folder':'text',parent,content:''});save();renderFiles()}return}if(button.hasAttribute('data-folder-up')){folderPath.pop();renderFiles();return}const card=button.closest('[data-file-id]');if(!card)return;const file=state.files.find(f=>f.id===card.dataset.fileId);if(!file)return;if(button.hasAttribute('data-file-delete')){if(confirm(`Delete “${file.name}” and its direct contents?`)){const ids=new Set([file.id,...state.files.filter(f=>f.parent===file.id).map(f=>f.id)]);state.files=state.files.filter(f=>!ids.has(f.id));save();renderFiles()}}else if(button.hasAttribute('data-file-rename')){const name=prompt('Rename',file.name);if(name?.trim()){file.name=name.trim();save();renderFiles()}}else if(file.type==='folder'){folderPath.push(file.id);renderFiles()}else editVirtualFile(file)}
function editVirtualFile(file){editingFileId=file.id;const content=windows.get('files').el.querySelector('.window-content');content.innerHTML=`<div class="row between"><button class="button" data-file-back>← Files</button><button class="button primary" data-file-save>Save</button></div><label class="field-label" for="editFileName">File name</label><input id="editFileName" class="field" value="${esc(file.name)}"><textarea id="editFileContents" class="field" aria-label="File contents" style="height:calc(100% - 75px);margin-top:9px;resize:none">${esc(file.content)}</textarea>`}
$('#shell').addEventListener('click',event=>{const b=event.target.closest('button');if(!b)return;if(b.hasAttribute('data-file-back')){renderFiles();return}if(b.hasAttribute('data-file-save')){const f=state.files.find(x=>x.id===editingFileId);if(f){f.name=$('#editFileName').value;f.content=$('#editFileContents').value;save();renderFiles();toast('Virtual file saved')}return}});

const firebaseConfig={apiKey:'AIzaSyA9LgxDNBDY5BPjwhBbldaHVoMAYI9Y19',authDomain:'peak-app-storage.firebaseapp.com',projectId:'peak-app-storage',storageBucket:'peak-app-storage.firebasestorage.app',messagingSenderId:'420331576022',appId:'1:420331576022:web:f82e4b90fa3c4a72160777'};const OWNER_EMAIL='REPLACE_WITH_OWNER_EMAIL';let firebasePromise=null;
async function firebase(){if(firebasePromise)return firebasePromise;firebasePromise=(async()=>{const [appSdk,dbSdk,authSdk]=await Promise.all([import('https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js'),import('https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js'),import('https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js')]);const app=appSdk.initializeApp(firebaseConfig);return{...dbSdk,...authSdk,app,db:dbSdk.getFirestore(app),auth:authSdk.getAuth(app)}})();try{return await firebasePromise}catch(error){firebasePromise=null;throw error}}
function handleStoreButton(button){if(button.hasAttribute('data-store-refresh'))loadStore();if(button.dataset.install){const app=storeApps.find(a=>a.id===button.dataset.install);if(app){if(!state.installed.some(a=>a.id===app.id))state.installed.push({id:app.id,name:app.name,description:app.description||'',html:app.html});save();renderChrome();toast('App installed. Open it from the app menu.')}}if(button.dataset-approve)reviewApp(button.dataset.approve,'approved');if(button.dataset-reject)reviewApp(button.dataset.reject,'rejected')}
function bindStore(){const form=$('#submitForm');if(form)form.onsubmit=async event=>{event.preventDefault();const data=new FormData(form),name=String(data.get('name')).trim(),description=String(data.get('description')).trim(),html=String(data.get('html'));if(!name||!html.trim()||html.length>350000){toast('Enter an app name and HTML source under 350 KB.');return}try{const api=await firebase(),user=api.auth.currentUser||(await api.signInAnonymously(api.auth)).user;await api.addDoc(api.collection(api.db,'apps'),{name,description,html,status:'pending',ownerUid:user.uid,createdAt:api.serverTimestamp()});form.reset();toast('App sent for approval.');await loadStore()}catch(error){console.error(error);toast('Could not submit. Check Firebase setup and security rules.')}};const upload=$('#htmlUpload');if(upload)upload.onchange=async()=>{const file=upload.files?.[0];if(!file)return;const form=$('#submitForm');form.elements.html.value=await file.text();if(!form.elements.name.value)form.elements.name.value=file.name.replace(/\.html$/i,'')}}
async function loadStore(){const publicEl=$('#publicApps');if(!publicEl)return;publicEl.innerHTML='<div class="empty">Connecting to the store…</div>';try{const api=await firebase();if(!api.auth.currentUser)await api.signInAnonymously(api.auth);const published=await api.getDocs(api.query(api.collection(api.db,'apps'),api.where('status','==','approved')));storeApps=published.docs.map(d=>({id:d.id,...d.data()}));publicEl.innerHTML=storeApps.map(a=>`<article class="store-card"><span class="card-icon">${icon('store')}</span><h3>${esc(a.name)}</h3><p>${esc(a.description||'Community app')}</p><div class="row between"><span class="badge">Approved</span><button class="button primary" data-install="${esc(a.id)}">Download &amp; install</button></div></article>`).join('')||'<div class="empty">No approved apps have been published yet.</div>';const status=$('#storeStatus');if(status)status.innerHTML=`Store connected. <button class="button" id="ownerSignIn">Owner sign in</button>`;$('#ownerSignIn')?.addEventListener('click',ownerSignIn);bindStore();const panel=$('#reviewPanel');if(panel&&api.auth.currentUser?.email===OWNER_EMAIL){panel.classList.remove('hidden');const pending=await api.getDocs(api.query(api.collection(api.db,'apps'),api.where('status','==','pending'))),list=$('#reviewList');list.innerHTML=pending.docs.map(d=>`<article class="store-card"><h3>${esc(d.data().name)}</h3><p>${esc(d.data().description||'No description')}</p><div class="row"><button class="button primary" data-review="${d.id}" data-review-status="approved">Approve</button><button class="button danger" data-review="${d.id}" data-review-status="rejected">Reject</button></div></article>`).join('')||'<div class="empty">No submissions awaiting review.</div>'}}catch(error){console.error(error);publicEl.innerHTML='<div class="status-error">Store connection failed. Enable Firebase Anonymous and Google sign-in, create Firestore, deploy firestore.rules, and host this page on HTTPS or localhost.</div>';const status=$('#storeStatus');if(status)status.textContent='Firebase setup required.'}}
async function ownerSignIn(){try{const api=await firebase(),provider=new api.GoogleAuthProvider();provider.setCustomParameters({prompt:'select_account'});await api.signInWithPopup(api.auth,provider);if(api.auth.currentUser?.email!==OWNER_EMAIL)toast('Signed in, but this account is not the configured owner.');await loadStore()}catch(error){console.error(error);toast('Owner sign-in failed. Check Firebase Google provider and allowed domains.')}}
async function reviewApp(id,status){try{const api=await firebase();if(api.auth.currentUser?.email!==OWNER_EMAIL){toast('Sign in with the configured owner Google account.');return}await api.updateDoc(api.doc(api.db,'apps',id),{status,reviewedAt:api.serverTimestamp(),reviewedBy:api.auth.currentUser.email});toast(`App ${status}.`);await loadStore()}catch(error){console.error(error);toast('Review was denied. Check owner email and deployed Firestore rules.')}}
$('#shell').addEventListener('click',event=>{const b=event.target.closest('[data-review]');if(b)reviewApp(b.dataset.review,b.dataset.reviewStatus)});
function updateClock(){const d=new Date();$('#clock').innerHTML=`${d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}<small>${d.toLocaleDateString([],{month:'short',day:'numeric'})}</small>`;$('#mobileTime').textContent=d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});$('#mobileDate').textContent=d.toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'})}
function toast(message){document.querySelector('.toast')?.remove();const el=document.createElement('div');el.className='toast';el.textContent=message;$('#shell').append(el);setTimeout(()=>el.remove(),2600)}
window.addEventListener('resize',()=>{syncAppearance();for(const [id,w]of windows)if(mode()==='mobile'){w.el.style.left='0';w.el.style.top='0'}});
$('#taskSettings').addEventListener('click',()=>openApp('settings'));$('#startButton').addEventListener('click',()=>startMenu.classList.toggle('open'));
renderChrome();$('#mobileBack').disabled=true;updateClock();setInterval(updateClock,15000);
})();
